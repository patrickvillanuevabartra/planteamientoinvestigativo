<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planteamiento Investigativo — Ingeniería URP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2a33; --paper:#eef1ec; --amber:#c8743b; --teal:#2f6d6a; --line:#c9cfc6;
  }
  *{box-sizing:border-box;}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       margin:0;line-height:1.6;font-size:17px;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px;}
  .kicker{font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--amber);margin-bottom:10px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:36px;line-height:1.15;margin:0 0 10px;}
  .sub{max-width:680px;color:#4a5a60;margin:0 0 24px;font-size:17px;}
  /* stepper */
  .stepper{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px;}
  .step{display:flex;align-items:center;gap:6px;flex:1;min-width:84px;}
  .stepClick{cursor:pointer;}
  .stepClick:hover .dot{border-color:var(--ink);}
  .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-family:'Poppins',sans-serif;background:#fff;flex-shrink:0;}
  .dot.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .step span{font-size:12.5px;color:#8a948f;}
  .step span.on{color:var(--ink);font-weight:600;}
  /* card */
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  h2{font-family:'Poppins',sans-serif;font-size:19px;font-weight:600;margin:0 0 16px;}
  label{display:block;font-family:'Poppins',sans-serif;font-size:13.5px;letter-spacing:.06em;color:#6a746f;margin:10px 0 6px;text-transform:uppercase;}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:17px;color:var(--ink);font-family:'Poppins',sans-serif;}
  textarea{resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .note{font-size:15px;color:#6a746f;margin:0 0 14px;}
  .blockLbl{font-family:'Poppins',sans-serif;font-size:15px;color:var(--teal);font-weight:500;margin:0 0 4px;}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;align-items:center;}
  button{cursor:pointer;transition:transform .08s,opacity .15s;font-family:'Poppins',sans-serif;}
  button:hover:not(:disabled){transform:translateY(-1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:12px 22px;font-size:15.5px;font-weight:600;}
  .btnGhost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:12px 20px;font-size:15.5px;font-weight:500;}
  .lineList{display:flex;flex-direction:column;gap:6px;}
  .lineOpt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:4px;padding:11px 13px;font-size:15.5px;color:var(--ink);width:100%;}
  .lineOpt.sel{border-color:var(--teal);background:#eef5f4;box-shadow:inset 3px 0 0 var(--teal);}
  .lineNum{font-family:'Poppins',sans-serif;color:var(--amber);font-size:13px;min-width:18px;}
  .coordsBox{margin-top:8px;padding:8px 12px;background:#eef5f4;border-radius:4px;font-size:13px;}
  .coordsBox b{font-family:'Poppins',sans-serif;}
  .hintWarn{font-size:12px;color:#9a3b2c;margin-top:6px;}
  .mapLink{color:var(--teal);font-size:13px;margin-left:10px;}
  .temaResult{background:var(--ink);color:#fff;border-radius:4px;padding:16px 18px;font-size:18px;font-family:'Poppins',sans-serif;line-height:1.45;margin-top:8px;}
  .temaResLbl{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .fishCenter{background:var(--ink);color:#fff;border-radius:4px;padding:12px 16px;font-style:italic;margin-bottom:16px;font-size:16px;}
  .fishLabel{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);font-style:normal;letter-spacing:.04em;display:block;margin-bottom:4px;}
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .catBox{border:1px solid var(--line);border-radius:4px;padding:12px;background:#fafbf9;}
  .catTitle{font-family:'Poppins',sans-serif;font-size:13.5px;color:var(--amber);margin-bottom:8px;}
  .causa{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:15px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:7px 9px;margin-bottom:4px;}
  .causa button{border:none;background:transparent;color:#b04a3a;font-size:16px;line-height:1;padding:0;}
  .causaWrap{margin-bottom:8px;}
  .subList{padding-left:12px;margin-top:2px;}
  .subcausa{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:14px;color:#5c584c;background:#f4f6f2;border:1px solid var(--line);border-radius:3px;padding:5px 8px;margin-bottom:4px;}
  .subcausa button{border:none;background:transparent;color:#b04a3a;font-size:14px;line-height:1;padding:0;}
  .addSub{font-size:12px;width:100%;margin-top:2px;}
  .catTitleRow{display:flex;gap:4px;align-items:center;margin-bottom:8px;}
  .catEdit{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);font-weight:600;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:3px;flex:1;}
  .catEdit:hover,.catEdit:focus{border-color:var(--line);background:#fff;}
  .catDel{border:none;background:transparent;color:#b04a3a;font-size:16px;line-height:1;padding:0 4px;cursor:pointer;}
  .parTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px;}
  .parTable th{background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-weight:500;font-size:13.5px;padding:9px;text-align:left;}
  .parTable th:not(:first-child){text-align:center;}
  .parTable td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top;}
  .parTable .prMeta{font-size:11px;color:#8a948f;margin-top:2px;}
  .parTable .prRow{background:#eef5f4;}
  .freqInp{width:64px;text-align:center;padding:4px;font-size:13px;}
  .prTag{background:var(--teal);color:#fff;font-family:'Poppins',sans-serif;font-size:11px;padding:2px 7px;border-radius:3px;}
  .p80{background:#f6e9d8;color:var(--amber);font-size:11px;padding:2px 7px;border-radius:3px;}
  .addInput{border:1px dashed var(--line);border-radius:3px;padding:6px 8px;font-size:13px;background:transparent;}
  .peItem{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:4px;padding:14px;margin-bottom:12px;}
  .peHead{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .peTag{font-family:'Poppins',sans-serif;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;}
  .peCat{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);}
  .peProblem{font-size:17px;font-weight:500;margin-bottom:8px;}
  .peTool{font-size:15px;color:var(--teal);background:#eef5f4;padding:7px 11px;border-radius:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .toast.err{background:#9a3b2c;}
  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:9px 18px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:15.5px;font-weight:500;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  /* lista */
  .listItem{border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px;background:#fff;}
  .listMeta{font-family:'Poppins',sans-serif;font-size:12px;color:#8a948f;margin-bottom:6px;display:flex;gap:12px;flex-wrap:wrap;}
  .listTema{font-family:'Poppins',sans-serif;font-size:17px;margin-bottom:6px;}
  .listPg{font-size:15px;color:#4a5a60;}
  .badge{background:#eef5f4;color:var(--teal);padding:2px 8px;border-radius:20px;font-size:11px;}
  .ejBtn{background:none;border:1px solid var(--teal);color:var(--teal);border-radius:3px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;}
  .ejBtn:hover{background:#eef5f4;}
  .ejBox{background:#f4f6f2;border-left:3px solid var(--amber);padding:10px 13px;margin:0 0 8px;font-size:15.5px;color:#555f5a;line-height:1.55;border-radius:3px;}
  .grupoBar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:16px;}
  .grupoBar .info{font-size:14.5px;color:#4a5a60;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;}
  .grupoBar .info b{color:var(--ink);}
  .grupoBar .info .cy{background:#eef5f4;color:var(--teal);padding:2px 8px;border-radius:20px;font-size:12px;}
  .grupoBar .acts{display:flex;gap:8px;}
  .btnSave{background:var(--teal);color:#fff;border:none;border-radius:4px;padding:9px 16px;font-size:14.5px;font-weight:600;}
  .btnMini{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:9px 13px;font-size:14.5px;}
  @media(max-width:680px){.grid6{grid-template-columns:1fr 1fr;}.row2,.row3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">URP · INGENIERÍA · LÍNEAS DE INVESTIGACIÓN 2026–2030</div>
  <h1>Del problema empresarial al planteamiento</h1>
  <p class="sub">Define problema y delimitaciones, fija el propósito, ancla en una línea oficial, arma el tema, formula el problema general y derívalo en un Ishikawa.</p>

  <div class="tabs">
    <button class="tab" id="tabFlujo" onclick="mostrarTab('flujo')">Nuevo planteamiento</button>
    <button class="tab on" id="tabLista" onclick="mostrarTab('lista')">Planteamientos guardados</button>
  </div>

  <!-- ============ VISTA FLUJO ============ -->
  <div id="vistaFlujo" style="display:none;">
    <div class="stepper" id="stepper"></div>
    <div id="grupoBar"></div>
    <div id="pasos"></div>
  </div>

  <!-- ============ VISTA LISTA ============ -->
  <div id="vistaLista">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <h2 style="margin:0;">Planteamientos guardados</h2>
        <button class="btnGhost" onclick="cargarLista()">↻ Actualizar</button>
      </div>
      <div id="listaCont" style="margin-top:16px;"><p class="note">Cargando…</p></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIGURACIÓN
// ============================================================
var PROXY_URL = "https://script.google.com/macros/s/AKfycbyeMZERRsQNsSUsdKet60IqndE2QWc_rORm0n6dFml7Gnf9-8ZEp71ZSuuWKurQM2JV/exec";

// Habilitar cuando actives la IA en el proxy (ruta action=ia).
var IA_ACTIVA = true;

// Field IDs de QuintaDB (para leer registros en la vista de lista)
var FIELD = {
  problema_empresarial : 'a2lZZdKmjctPLGBfJcGJWS',
  empresa              : 'cCDSkvW6TcNyo-WRq7bCk4',
  ubicacion            : 'b7cmoanCjfW6BcNsjrkSo7',
  mapa                 : 'ddOSoOo8jjW50fWOaWntGQ',
  pretest              : 'btW4hdNYbeW4pcHwWpzmkV',
  test                 : 'ddVHFdTCjndOoRW6ScWOfV',
  postest              : 'cqj8oCqYnnxldcNGGvW6SU',
  proposito            : 'bWD8o5W4bbx7r6W7fydmoA',
  linea                : 'ddLIhdOmjnuOoTnCkAW6jz',
  origen_linea         : 'ddLSkDn8nab6JcSXT8xmkE',
  tema                 : 'cUfSonW7DoW7BcRJhcNxjP',
  problema_general     : 'dcPuBdImjkW4FdHrRdGSoE',
  problemas_especificos: 'ddTbpdUCjiW6flW5W0WPvR',
  estudiante_grupo     : 'cuW51jWQTpWRyjbmkWmmoQ',
  curso                : 'cZlIbGW6jiaOoZW4hcL8oR',
  fecha_registro       : 'ddKCoGv8nkdikTW7n-m8ot',
  ciclo                : 'bVrvWbW45cVyk1lSkmkSoq',
  numero_grupo         : 'cprSkAWRDdR4kRpmksqw82',
  coordinador          : 'cCWQqVWOfdSikDWOLHt8kq',
  estructura           : 'cbW64-W5XcTRq3nmk4emkk'
};

// ============================================================
//  DATOS: 14 líneas de Ingeniería URP 2026-2030
// ============================================================
var LINEAS = [
  "Ingeniería estructural y de materiales",
  "Ingeniería hidráulica y gestión de recursos hídricos",
  "Mecánica de suelos, geotecnia y pavimentos",
  "Planeamiento y optimización de procesos (T)",
  "Sostenibilidad, eficiencia energética y evaluación del impacto ambiental (T)",
  "Ingeniería vial y gestión del transporte",
  "Planeamiento, gestión de operaciones, cadena de suministro y excelencia operacional",
  "Procesamiento digital, visión artificial y sistemas embebidos",
  "Control y automatización de procesos",
  "Diseño, manufactura e ingeniería asistida por computadora, CAD/CAM/CAE",
  "Robótica, sistemas mecatrónicos, biomecatrónicos y dispositivos médicos",
  "Inteligencia artificial, ciencia de datos y sistemas inteligentes (T)",
  "Ingeniería de software (T)",
  "Sistemas de información y tecnologías de información"
];
var CATEGORIAS = ["Mano de obra","Maquinaria","Método","Material","Medición","Medio ambiente"];
var PASOS_NOMBRES = ["Problema","Delimitación","Propósito","Línea","Tema","General","Ishikawa","Pareto","Específicos"];

// Datos institucionales fijos (no editables por el usuario)
var CURSO_FIJO = "Taller de Investigación en Ingeniería I";
var PROFESOR_FIJO = "Mg. Ing. Patrick Horacio Villanueva Bartra";
// Ciclos disponibles en el desplegable
var CICLOS = ["2026-2","2027-1","2027-2","2028-1","2028-2","2029-1","2029-2"];

// Ejemplos guía por aspecto del problema (Manual URP 2020, p.8).
// Basados en un caso real del curso (empresa reservada).
var EJEMPLO_PROB = {
  pob: "Los tres analistas y el jefe del área de adquisiciones, y detrás de ellos las áreas usuarias —producción, mantenimiento y almacén— que no pueden operar cuando el material que solicitaron no llega a tiempo.",
  cau: "Cada analista lleva su propia hoja de cálculo y no comparte la información con el resto del equipo; las órdenes se aprueban de palabra y recién se documentan cuando el material ya llegó; los pedidos se atienden en el orden en que entran, sin distinguir cuáles son urgentes; y una vez emitida la orden, nadie vuelve a revisar si el proveedor cumplió la fecha acordada.",
  con: "Las áreas usuarias reciben sus materiales con retraso y detienen sus operaciones; para cubrir la urgencia, el área compra a sobreprecio y sin negociar; y como cada quien maneja su propia hoja, se pierde el rastro de qué se pidió, a quién y en qué estado quedó.",
  ctx: "Ocurre de forma sostenida en la sede principal y se agrava en los cierres de mes, cuando varias áreas solicitan compras al mismo tiempo y el equipo las atiende sin un criterio claro de prioridad.",
  mag: "En el último semestre, 38 de cada 100 órdenes de compra llegaron con más de 5 días hábiles de retraso frente a la fecha comprometida, lo que obligó a compras urgentes a sobreprecio y encareció el abastecimiento del período."
};
function toggleEj(id){
  var el=document.getElementById('ej_'+id);
  if(el) el.style.display = (el.style.display==='none'||!el.style.display) ? 'block' : 'none';
}

function limpiarLinea(l){ return l.replace(/\s*\(T\)\s*$/,'').trim(); }

// Consolida los 5 aspectos del problema (Manual URP 2020, p.8) en un texto único.
// Ese texto es el que usa el Ishikawa (efecto central), el payload y la lista.
function consolidarProblema(){
  var partes=[];
  if(S.probPoblacion)     partes.push('Población afectada: '+S.probPoblacion.trim());
  if(S.probCausas)        partes.push('Posibles causas raíz: '+S.probCausas.trim());
  if(S.probConsecuencias) partes.push('Consecuencias: '+S.probConsecuencias.trim());
  if(S.probContexto)      partes.push('Dónde/cómo/cuándo se manifiesta: '+S.probContexto.trim());
  if(S.probMagnitud)      partes.push('Magnitud del problema: '+S.probMagnitud.trim());
  S.problemaEmpresa = partes.join('\n');
  return S.problemaEmpresa;
}
// Cuántos de los 5 aspectos tienen contenido (al menos unos caracteres).
function aspectosCompletos(){
  var xs=[S.probPoblacion,S.probCausas,S.probConsecuencias,S.probContexto,S.probMagnitud];
  return xs.filter(function(x){ return (x||'').trim().length>=3; }).length;
}
function extraerCoords(url){
  if(!url) return '';
  var t=url.trim();
  var m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return m[1]+','+m[2];
  var d=t.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  if(d) return d[1]+','+d[2];
  return '';
}

// ============================================================
//  ESTADO
// ============================================================
var S = {
  paso:0,
  // Registro del grupo (paso 0)
  ciclo:'', numeroGrupo:'', coordinador:'',
  // Descripción del problema — 5 aspectos exigidos por el Manual URP 2020 (p.8)
  probPoblacion:'', probCausas:'', probConsecuencias:'', probContexto:'', probMagnitud:'',
  problemaEmpresa:'', empresa:'', ubicacion:'', mapsLink:'',
  pretest:'', test:'', postest:'',
  proposito:'', lineaIdx:null, adoptada:null, lineaCustom:false, lineaCustomTexto:'',
  tema:'', problemaGeneral:'',
  categorias: CATEGORIAS.slice(),   // 6M editables
  causas:{}, especificos:[],
  paretoFreq:{},        // clave "categoria|causa|subcausa" -> frecuencia (número)
  priorizadas:[],       // hasta 3 subcausas seleccionadas {categoria,causa,sub}
  estudiante:'', curso:'', recordId:null
};
S.categorias.forEach(function(c){ S.causas[c]=[]; });   // cada causa: {txt, subs:[]}

function lineaTexto(){
  if(S.lineaCustom) return S.lineaCustomTexto ? S.lineaCustomTexto.trim() : null;
  var l = S.adoptada ? S.adoptada.texto : (S.lineaIdx!==null?LINEAS[S.lineaIdx]:null);
  return l ? limpiarLinea(l) : null;
}
function periodo(){
  if(S.pretest && S.postest) return S.pretest+' – '+S.postest;
  return S.pretest||S.postest||'[periodo]';
}
function anio(){
  var t=(S.pretest||S.test||S.postest||'');
  var m=t.match(/(20\d{2}|19\d{2})/); return m?m[1]:'[año]';
}
function armarTema(){
  if(!S.proposito || !lineaTexto()) return '';
  var p = S.proposito.trim().replace(/\.?\s*$/,'');
  return p+' mediante '+lineaTexto()+' en la empresa '+(S.empresa||'[Empresa]')+' en el periodo '+periodo();
}

// ============================================================
//  RENDER
// ============================================================
function mostrarTab(cual){
  document.getElementById('vistaFlujo').style.display = cual==='flujo'?'block':'none';
  document.getElementById('vistaLista').style.display = cual==='lista'?'block':'none';
  document.getElementById('tabFlujo').classList.toggle('on', cual==='flujo');
  document.getElementById('tabLista').classList.toggle('on', cual==='lista');
  if(cual==='lista') cargarLista();
}

function renderStepper(){
  var st=document.getElementById('stepper');
  if(S.paso<1){ st.innerHTML=''; st.style.display='none'; return; }
  st.style.display='flex';
  var h='';
  for(var i=0;i<PASOS_NOMBRES.length;i++){
    var n=i+1;
    h+='<div class="step stepClick" onclick="irAPaso('+n+')" title="Ir al paso '+n+'"><div class="dot '+(n<=S.paso?'on':'')+'">'+n+'</div>'+
       '<span class="'+(n===S.paso?'on':'')+'">'+PASOS_NOMBRES[i]+'</span></div>';
  }
  st.innerHTML=h;
}

// Navegación directa desde el menú de pasos (captura el paso actual antes de saltar)
function irAPaso(n){
  if(n===S.paso) return;
  capturarPasoActual();
  // Si vamos hacia (o más allá de) Pareto/Específicos, aseguramos derivar datos
  if(n>=8) armarPareto();
  if(n>=9) armarEspecificos();
  go(n);
}

function renderGrupoBar(){
  var bar=document.getElementById('grupoBar');
  if(S.paso<1){ bar.innerHTML=''; bar.style.display='none'; return; }
  bar.style.display='block';

// ---- PARETO sobre subcausas ----
function subKey(cat,causa,sub){ return cat+'|'+causa+'|'+sub; }

// Reúne todas las subcausas del Ishikawa y sincroniza el mapa de frecuencias
function armarPareto(){
  var vistos={};
  S.categorias.forEach(function(cat){
    (S.causas[cat]||[]).forEach(function(cz){
      (cz.subs||[]).forEach(function(sb){
        var k=subKey(cat,cz.txt,sb);
        vistos[k]=true;
        if(!(k in S.paretoFreq)) S.paretoFreq[k]=1;   // frecuencia por defecto 1
      });
    });
  });
  // limpia frecuencias de subcausas ya inexistentes
  Object.keys(S.paretoFreq).forEach(function(k){ if(!vistos[k]) delete S.paretoFreq[k]; });
}

// Devuelve las subcausas ordenadas por frecuencia desc, con metadatos
function paretoOrdenado(){
  var arr=[];
  S.categorias.forEach(function(cat){
    (S.causas[cat]||[]).forEach(function(cz){
      (cz.subs||[]).forEach(function(sb){
        var k=subKey(cat,cz.txt,sb);
        arr.push({ key:k, categoria:cat, causa:cz.txt, sub:sb, freq:Number(S.paretoFreq[k]||0) });
      });
    });
  });
  arr.sort(function(a,b){ return b.freq-a.freq; });
  // marca cuáles están priorizadas y su índice PE
  arr.forEach(function(f){
    f.priorizada=false;
    S.priorizadas.forEach(function(p,pi){
      if(p && subKey(p.categoria,p.causa,p.sub)===f.key){ f.priorizada=true; f.prIdx=pi; }
    });
  });
  return arr;
}

function setFreq(key,v){
  S.paretoFreq[key]=Math.max(0, Number(v)||0);
  render();
}

// Fija la subcausa priorizada en la posición pi (0..2) a partir de su key
function setPriorizada(pi,key){
  if(!key){ S.priorizadas[pi]=null; render(); return; }
  var parts=key.split('|');
  S.priorizadas[pi]={ categoria:parts[0], causa:parts[1], sub:parts[2] };
  render();
}

function catNombre(ci){ return S.categorias[ci]; }

function agregarCategoria(){
  var base='Nueva categoría', nom=base, k=2;
  while(S.categorias.indexOf(nom)!==-1){ nom=base+' '+k; k++; }
  S.categorias.push(nom); S.causas[nom]=[]; render();
}
function quitarCategoria(ci){
  var nom=S.categorias[ci];
  if(!confirm('¿Eliminar la categoría "'+nom+'" y sus causas?')) return;
  S.categorias.splice(ci,1); delete S.causas[nom]; render();
}
function renombrarCategoria(ci,nuevo){
  nuevo=(nuevo||'').trim(); if(!nuevo) { render(); return; }
  var viejo=S.categorias[ci];
  if(nuevo===viejo) return;
  if(S.categorias.indexOf(nuevo)!==-1){ toast('Ya existe una categoría con ese nombre',true); render(); return; }
  S.causas[nuevo]=S.causas[viejo]; delete S.causas[viejo]; S.categorias[ci]=nuevo; render();
}

// Construye 3 problemas específicos desde las subcausas priorizadas en el Pareto
// (preservando problema/herramienta ya editados por subcausa).
function armarEspecificos(){
  var previos={};
  S.especificos.forEach(function(e){ if(e.sub) previos[e.categoria+'|'+e.causa+'|'+e.sub]=e; });
  var lista=[];
  S.priorizadas.forEach(function(p){
    if(!p) return;
    var k=p.categoria+'|'+p.causa+'|'+p.sub;
    lista.push(previos[k] || {categoria:p.categoria, causa:p.causa, sub:p.sub, problema:'', herramienta:''});
  });
  S.especificos=lista;
}

// Serializa los específicos a texto (uno por línea) para el campo de QuintaDB
function serializarEspecificos(){
  return S.especificos.map(function(e,i){
    var sub = e.sub ? ' (subcausa priorizada: '+e.sub+')' : '';
    return 'PE'+(i+1)+' ['+e.categoria+' › '+e.causa+'] '+(e.problema||'')+sub+' || Herramienta: '+(e.herramienta||'');
  }).join('\n');
}

// ============================================================
//  SERIALIZAR / RESTAURAR ESTADO COMPLETO (campo "Estructura completa")
// ============================================================
// Guarda todo lo que no cabe en campos individuales: los 5 aspectos del
// problema, el Ishikawa (categorías + causas + subcausas), las frecuencias
// del Pareto, las 3 priorizadas y los específicos con su herramienta.
function serializarEstado(){
  return JSON.stringify({
    v:1,
    prob:{ pob:S.probPoblacion, cau:S.probCausas, con:S.probConsecuencias, ctx:S.probContexto, mag:S.probMagnitud },
    delim:{ pretest:S.pretest, test:S.test, postest:S.postest, mapsLink:S.mapsLink },
    linea:{ idx:S.lineaIdx, custom:S.lineaCustom, customTexto:S.lineaCustomTexto,
            adoptada:S.adoptada },
    categorias:S.categorias,
    causas:S.causas,
    paretoFreq:S.paretoFreq,
    priorizadas:S.priorizadas,
    especificos:S.especificos
  });
}

function restaurarEstado(json){
  var d;
  try { d=JSON.parse(json); } catch(e){ return false; }
  if(!d) return false;
  if(d.prob){ S.probPoblacion=d.prob.pob||''; S.probCausas=d.prob.cau||'';
    S.probConsecuencias=d.prob.con||''; S.probContexto=d.prob.ctx||''; S.probMagnitud=d.prob.mag||'';
    consolidarProblema(); }
  if(d.delim){ S.pretest=d.delim.pretest||''; S.test=d.delim.test||''; S.postest=d.delim.postest||''; if(d.delim.mapsLink) S.mapsLink=d.delim.mapsLink; }
  if(d.linea){ S.lineaIdx=(d.linea.idx==null?null:d.linea.idx); S.lineaCustom=!!d.linea.custom;
    S.lineaCustomTexto=d.linea.customTexto||''; S.adoptada=d.linea.adoptada||null; }
  if(d.categorias){ S.categorias=d.categorias; }
  if(d.causas){ S.causas=d.causas; }
  if(d.paretoFreq){ S.paretoFreq=d.paretoFreq; }
  if(d.priorizadas){ S.priorizadas=d.priorizadas; }
  if(d.especificos){ S.especificos=d.especificos; }
  return true;
}

             : (S.adoptada && S.adoptada.origen==='paraguas') ? 'paraguas' : 'oficial';

  var payload={

    ubicacion:S.ubicacion,
    mapa:extraerCoords(S.mapsLink)||S.mapsLink,
    pretest:S.pretest, test:S.test, postest:S.postest,
    proposito:S.proposito,
    linea:lineaTexto()||'',
    origen_linea:origen,
    tema:S.tema,
    problema_general:S.problemaGeneral,
    problemas_especificos:serializarEspecificos(),
    estudiante_grupo:grupoTxt,

    ciclo:S.ciclo,
    numero_grupo:S.numeroGrupo,
    coordinador:S.coordinador,
    estructura:serializarEstado()
  };

  function restore(){
    if(btnBar){ btnBar.disabled=false; btnBar.textContent = S.recordId?'Actualizar':'Guardar'; }
    if(btn8){ btn8.disabled=false; btn8.textContent='Guardar en QuintaDB'; }
  }

  var params = { payload: encodeURIComponent(JSON.stringify(payload)) };
  if(S.recordId) params.record_id = S.recordId;   // si existe, el proxy actualiza

  jsonpCall(params, function(res){
    if(res && res.ok){
      if(res.qid) S.recordId = res.qid;            // memoriza el id para próximas actualizaciones

    }
  }, function(){
    restore();
    toast('Error de red al guardar',true);
  });
}

// JSONP helper: inyecta un <script> con callback para saltar CORS
var _jsonpId=0;
function jsonpCall(params, onOk, onErr){
  _jsonpId++;
  var cbName='_pi_cb_'+_jsonpId;
  var timer=setTimeout(function(){ cleanup(); if(onErr)onErr(); }, 20000);
  window[cbName]=function(data){ cleanup(); if(onOk)onOk(data); };
  function cleanup(){ clearTimeout(timer); try{delete window[cbName];}catch(e){} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); }
  var qs='callback='+cbName;
  for(var k in params){ qs+='&'+k+'='+params[k]; }
  var sc=document.createElement('script');
  sc.src=PROXY_URL+'?'+qs;
  sc.onerror=function(){ cleanup(); if(onErr)onErr(); };
  document.body.appendChild(sc);
}
function pad(n){ return n<10?'0'+n:''+n; }

         '<div class="listTema">'+esc(g('tema')||g('problema_general')||'(sin tema)')+'</div>'+
         '<div class="listPg">'+esc(g('problema_general')||'')+'</div>'+
         '<button class="btnMini" style="margin-top:10px;" onclick="continuarEdicion(\''+rec.id+'\')">Continuar edición →</button>'+
         '</div>';
    });
    cont.innerHTML=h;
  }, function(){ cont.innerHTML='<p class="hintWarn">Error de red al cargar.</p>'; });
}

// Reconstruye el estado desde un registro guardado y abre el flujo para seguir editando
function continuarEdicion(recId){
  var rec=_recordsCache[recId];
  if(!rec){ toast('No se encontró el registro',true); return; }
  var v=rec.values||{};
  function g(k){ return v[FIELD[k]]||''; }

  // reset del estado conservando estructura
  S.recordId = recId;
  S.ciclo=g('ciclo'); S.numeroGrupo=g('numero_grupo'); S.coordinador=g('coordinador');
  S.empresa=g('empresa'); S.ubicacion=g('ubicacion'); S.mapsLink=g('mapa');
  S.pretest=g('pretest'); S.test=g('test'); S.postest=g('postest');
  S.proposito=g('proposito');
  S.tema=g('tema'); S.problemaGeneral=g('problema_general');

  // Preferir reconstrucción COMPLETA desde el JSON "Estructura completa"
  var estr=g('estructura');
  var reconstruido = estr ? restaurarEstado(estr) : false;

  if(!reconstruido){
    // Fallback: reconstruir lo básico desde los campos de texto sueltos
    var prob=g('problema_empresarial');
    S.probPoblacion=S.probCausas=S.probConsecuencias=S.probContexto=S.probMagnitud='';
    if(prob){
      var mapEtq={'Población afectada:':'probPoblacion','Posibles causas raíz:':'probCausas',
        'Consecuencias:':'probConsecuencias','Dónde/cómo/cuándo se manifiesta:':'probContexto',
        'Magnitud del problema:':'probMagnitud'};
      var encontrado=false;
      prob.split('\n').forEach(function(ln){
        for(var etq in mapEtq){ if(ln.indexOf(etq)===0){ S[mapEtq[etq]]=ln.slice(etq.length).trim(); encontrado=true; } }
      });
      if(!encontrado) S.probPoblacion=prob;
      consolidarProblema();
    }
    var lin=g('linea'), orig=g('origen_linea');
    if(lin){
      var idx=LINEAS.indexOf(lin);
      if(idx!==-1){ S.lineaIdx=idx; S.lineaCustom=false; S.adoptada={texto:lin,origen:'oficial'}; }
      else { S.lineaCustom=true; S.lineaCustomTexto=lin; S.adoptada={texto:lin,origen:orig||'paraguas'}; }
    }
  }

  toast(reconstruido ? 'Planteamiento cargado completo — continúa la edición' : 'Planteamiento cargado — continúa la edición');
  mostrarTab('flujo');
  go(1);
}

// ============================================================
//  TOAST
// ============================================================
var toastTimer;
function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.className='toast'+(err?' err':''); },3000);
}

// init
render();
cargarLista();
</script>
