<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planteamiento Investigativo — Ingeniería URP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2a33; --paper:#eef1ec; --amber:#c8743b; --teal:#2f6d6a; --line:#c9cfc6;
  }
  *{box-sizing:border-box;}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       margin:0;line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px;}
  .kicker{font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--amber);margin-bottom:10px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:32px;line-height:1.15;margin:0 0 10px;}
  .sub{max-width:620px;color:#4a5a60;margin:0 0 24px;}
  /* stepper */
  .stepper{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px;}
  .step{display:flex;align-items:center;gap:6px;flex:1;min-width:84px;}
  .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-family:'Poppins',sans-serif;background:#fff;flex-shrink:0;}
  .dot.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .step span{font-size:11.5px;color:#8a948f;}
  .step span.on{color:var(--ink);font-weight:600;}
  /* card */
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  h2{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;margin:0 0 16px;}
  label{display:block;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.06em;color:#6a746f;margin:10px 0 6px;text-transform:uppercase;}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:10px 11px;font-size:15px;color:var(--ink);font-family:'Poppins',sans-serif;}
  textarea{resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .note{font-size:13px;color:#6a746f;margin:0 0 14px;}
  .blockLbl{font-family:'Poppins',sans-serif;font-size:13px;color:var(--teal);font-weight:500;margin:0 0 4px;}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;align-items:center;}
  button{cursor:pointer;transition:transform .08s,opacity .15s;font-family:'Poppins',sans-serif;}
  button:hover:not(:disabled){transform:translateY(-1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:11px 20px;font-size:14px;font-weight:600;}
  .btnGhost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:11px 18px;font-size:14px;font-weight:500;}
  .lineList{display:flex;flex-direction:column;gap:6px;}
  .lineOpt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:4px;padding:10px 12px;font-size:14px;color:var(--ink);width:100%;}
  .lineOpt.sel{border-color:var(--teal);background:#eef5f4;box-shadow:inset 3px 0 0 var(--teal);}
  .lineNum{font-family:'Poppins',sans-serif;color:var(--amber);font-size:13px;min-width:18px;}
  .coordsBox{margin-top:8px;padding:8px 12px;background:#eef5f4;border-radius:4px;font-size:13px;}
  .coordsBox b{font-family:'Poppins',sans-serif;}
  .hintWarn{font-size:12px;color:#9a3b2c;margin-top:6px;}
  .mapLink{color:var(--teal);font-size:13px;margin-left:10px;}
  .temaResult{background:var(--ink);color:#fff;border-radius:4px;padding:16px 18px;font-size:16px;font-family:'Poppins',sans-serif;line-height:1.4;margin-top:8px;}
  .temaResLbl{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .fishCenter{background:var(--ink);color:#fff;border-radius:4px;padding:12px 16px;font-style:italic;margin-bottom:16px;font-size:14px;}
  .fishLabel{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);font-style:normal;letter-spacing:.04em;display:block;margin-bottom:4px;}
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .catBox{border:1px solid var(--line);border-radius:4px;padding:12px;background:#fafbf9;}
  .catTitle{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);margin-bottom:8px;}
  .causa{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 8px;margin-bottom:5px;}
  .causa button{border:none;background:transparent;color:#b04a3a;font-size:16px;line-height:1;padding:0;}
  .addInput{border:1px dashed var(--line);border-radius:3px;padding:6px 8px;font-size:13px;background:transparent;}
  .peItem{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:4px;padding:14px;margin-bottom:12px;}
  .peHead{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .peTag{font-family:'Poppins',sans-serif;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;}
  .peCat{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);}
  .peProblem{font-size:15px;font-weight:500;margin-bottom:8px;}
  .peTool{font-size:13px;color:var(--teal);background:#eef5f4;padding:6px 10px;border-radius:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .toast.err{background:#9a3b2c;}
  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:14px;font-weight:500;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  /* lista */
  .listItem{border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px;background:#fff;}
  .listMeta{font-family:'Poppins',sans-serif;font-size:12px;color:#8a948f;margin-bottom:6px;display:flex;gap:12px;flex-wrap:wrap;}
  .listTema{font-family:'Poppins',sans-serif;font-size:15px;margin-bottom:6px;}
  .listPg{font-size:13px;color:#4a5a60;}
  .badge{background:#eef5f4;color:var(--teal);padding:2px 8px;border-radius:20px;font-size:11px;}
  @media(max-width:680px){.grid6{grid-template-columns:1fr 1fr;}.row2,.row3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">URP · INGENIERÍA · LÍNEAS DE INVESTIGACIÓN 2026–2030</div>
  <h1>Del problema empresarial al planteamiento</h1>
  <p class="sub">Define problema y delimitaciones, fija el propósito, ancla en una línea oficial, arma el tema, formula el problema general y derívalo en un Ishikawa.</p>

  <div class="tabs">
    <button class="tab on" id="tabFlujo" onclick="mostrarTab('flujo')">Nuevo planteamiento</button>
    <button class="tab" id="tabLista" onclick="mostrarTab('lista')">Planteamientos guardados</button>
  </div>

  <!-- ============ VISTA FLUJO ============ -->
  <div id="vistaFlujo">
    <div class="stepper" id="stepper"></div>
    <div id="pasos"></div>
  </div>

  <!-- ============ VISTA LISTA ============ -->
  <div id="vistaLista" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <h2 style="margin:0;">Planteamientos guardados</h2>
        <button class="btnGhost" onclick="cargarLista()">↻ Actualizar</button>
      </div>
      <div id="listaCont" style="margin-top:16px;"><p class="note">Cargando…</p></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIGURACIÓN
// ============================================================
var PROXY_URL = "https://script.google.com/macros/s/AKfycbyeMZERRsQNsSUsdKet60IqndE2QWc_rORm0n6dFml7Gnf9-8ZEp71ZSuuWKurQM2JV/exec";

// Habilitar cuando actives la IA en el proxy (ruta action=ia).
var IA_ACTIVA = false;

// Field IDs de QuintaDB (para leer registros en la vista de lista)
var FIELD = {
  problema_empresarial : 'a2lZZdKmjctPLGBfJcGJWS',
  empresa              : 'cCDSkvW6TcNyo-WRq7bCk4',
  ubicacion            : 'b7cmoanCjfW6BcNsjrkSo7',
  mapa                 : 'ddOSoOo8jjW50fWOaWntGQ',
  pretest              : 'btW4hdNYbeW4pcHwWpzmkV',
  test                 : 'ddVHFdTCjndOoRW6ScWOfV',
  postest              : 'cqj8oCqYnnxldcNGGvW6SU',
  proposito            : 'bWD8o5W4bbx7r6W7fydmoA',
  linea                : 'ddLIhdOmjnuOoTnCkAW6jz',
  origen_linea         : 'ddLSkDn8nab6JcSXT8xmkE',
  tema                 : 'cUfSonW7DoW7BcRJhcNxjP',
  problema_general     : 'dcPuBdImjkW4FdHrRdGSoE',
  problemas_especificos: 'ddTbpdUCjiW6flW5W0WPvR',
  estudiante_grupo     : 'cuW51jWQTpWRyjbmkWmmoQ',
  curso                : 'cZlIbGW6jiaOoZW4hcL8oR',
  fecha_registro       : 'ddKCoGv8nkdikTW7n-m8ot'
};

// ============================================================
//  DATOS: 14 líneas de Ingeniería URP 2026-2030
// ============================================================
var LINEAS = [
  "Ingeniería estructural y de materiales",
  "Ingeniería hidráulica y gestión de recursos hídricos",
  "Mecánica de suelos, geotecnia y pavimentos",
  "Planeamiento y optimización de procesos (T)",
  "Sostenibilidad, eficiencia energética y evaluación del impacto ambiental (T)",
  "Ingeniería vial y gestión del transporte",
  "Planeamiento, gestión de operaciones, cadena de suministro y excelencia operacional",
  "Procesamiento digital, visión artificial y sistemas embebidos",
  "Control y automatización de procesos",
  "Diseño, manufactura e ingeniería asistida por computadora, CAD/CAM/CAE",
  "Robótica, sistemas mecatrónicos, biomecatrónicos y dispositivos médicos",
  "Inteligencia artificial, ciencia de datos y sistemas inteligentes (T)",
  "Ingeniería de software (T)",
  "Sistemas de información y tecnologías de información"
];
var CATEGORIAS = ["Mano de obra","Maquinaria","Método","Material","Medición","Medio ambiente"];
var PASOS_NOMBRES = ["Problema","Delimitación","Propósito","Línea","Tema","General","Ishikawa","Específicos"];

function limpiarLinea(l){ return l.replace(/\s*\(T\)\s*$/,'').trim(); }
function extraerCoords(url){
  if(!url) return '';
  var t=url.trim();
  var m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return m[1]+','+m[2];
  var d=t.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  if(d) return d[1]+','+d[2];
  return '';
}

// ============================================================
//  ESTADO
// ============================================================
var S = {
  paso:1,
  problemaEmpresa:'', empresa:'', ubicacion:'', mapsLink:'',
  pretest:'', test:'', postest:'',
  proposito:'', lineaIdx:null, adoptada:null,
  tema:'', problemaGeneral:'',
  causas:{}, especificos:[],
  estudiante:'', curso:''
};
CATEGORIAS.forEach(function(c){ S.causas[c]=[]; });

function lineaTexto(){
  var l = S.adoptada ? S.adoptada.texto : (S.lineaIdx!==null?LINEAS[S.lineaIdx]:null);
  return l ? limpiarLinea(l) : null;
}
function periodo(){
  if(S.pretest && S.postest) return S.pretest+' – '+S.postest;
  return S.pretest||S.postest||'[periodo]';
}
function anio(){
  var t=(S.pretest||S.test||S.postest||'');
  var m=t.match(/(20\d{2}|19\d{2})/); return m?m[1]:'[año]';
}
function armarTema(){
  if(!S.proposito || !lineaTexto()) return '';
  var p = S.proposito.trim().replace(/\.?\s*$/,'');
  return p+' mediante '+lineaTexto()+' en la empresa '+(S.empresa||'[Empresa]')+' en el periodo '+periodo();
}

// ============================================================
//  RENDER
// ============================================================
function mostrarTab(cual){
  document.getElementById('vistaFlujo').style.display = cual==='flujo'?'block':'none';
  document.getElementById('vistaLista').style.display = cual==='lista'?'block':'none';
  document.getElementById('tabFlujo').classList.toggle('on', cual==='flujo');
  document.getElementById('tabLista').classList.toggle('on', cual==='lista');
  if(cual==='lista') cargarLista();
}

function renderStepper(){
  var h='';
  for(var i=0;i<PASOS_NOMBRES.length;i++){
    var n=i+1;
    h+='<div class="step"><div class="dot '+(n<=S.paso?'on':'')+'">'+n+'</div>'+
       '<span class="'+(n===S.paso?'on':'')+'">'+PASOS_NOMBRES[i]+'</span></div>';
  }
  document.getElementById('stepper').innerHTML=h;
}

function render(){
  renderStepper();
  var c=document.getElementById('pasos'), h='';
  if(S.paso===1){
    h='<div class="card"><h2>01 · Problema identificado en la empresa</h2>'+
      '<textarea rows="5" id="f_prob" placeholder="Describe el problema observado: contexto, síntomas, indicador afectado (p. ej. baja Exactitud de Registro de Inventarios), impacto…">'+esc(S.problemaEmpresa)+'</textarea>'+
      '<div class="actions"><span></span><button class="btn" onclick="p1next()">Continuar →</button></div></div>';
  }
  else if(S.paso===2){
    h='<div class="card"><h2>02 · Delimitación</h2>'+
      '<div class="blockLbl">◆ Delimitación espacial</div>'+
      '<div class="row2"><div><label>Empresa / unidad de estudio</label>'+
      '<input id="f_emp" value="'+esc(S.empresa)+'" placeholder="Nombre de la empresa o área"></div>'+
      '<div><label>Ubicación (distrito, ciudad)</label>'+
      '<input id="f_ubi" value="'+esc(S.ubicacion)+'" placeholder="Ej. Ate, Lima"></div></div>'+
      '<label>Link de Google Maps</label>'+
      '<input id="f_map" value="'+esc(S.mapsLink)+'" oninput="onMaps()" placeholder="Pega el link de Google Maps (barra de direcciones)">'+
      '<div id="mapInfo"></div>'+
      '<div class="blockLbl" style="margin-top:22px;">◆ Delimitación temporal · diseño pre-post</div>'+
      '<p class="note">Define preliminarmente los momentos del estudio (fechas o meses).</p>'+
      '<div class="row3"><div><label>Pretest</label><input id="f_pre" value="'+esc(S.pretest)+'" placeholder="Ej. mar 2026"></div>'+
      '<div><label>Test (intervención)</label><input id="f_tst" value="'+esc(S.test)+'" placeholder="Ej. abr–may 2026"></div>'+
      '<div><label>Postest</label><input id="f_pos" value="'+esc(S.postest)+'" placeholder="Ej. jun 2026"></div></div>'+
      '<div class="actions"><button class="btnGhost" onclick="go(1)">← Atrás</button>'+
      '<button class="btn" onclick="p2next()">Continuar →</button></div></div>';
  }
  else if(S.paso===3){
    h='<div class="card"><h2>03 · Propósito de la investigación</h2>'+
      '<p class="note">¿Qué busca lograr la investigación? Escríbelo en tus palabras (p. ej. "mejorar la exactitud del registro de inventarios reduciendo errores operativos").</p>'+
      '<textarea rows="4" id="f_prop" placeholder="Propósito de la investigación…">'+esc(S.proposito)+'</textarea>'+
      '<div class="actions"><button class="btnGhost" onclick="go(2)">← Atrás</button>'+
      '<button class="btn" onclick="p3next()">Continuar →</button></div></div>';
  }
  else if(S.paso===4){
    var lo='';
    for(var i=0;i<LINEAS.length;i++){
      lo+='<button class="lineOpt '+(S.lineaIdx===i?'sel':'')+'" onclick="selLinea('+i+')">'+
          '<span class="lineNum">'+(i+1)+'</span><span>'+esc(LINEAS[i])+'</span></button>';
    }
    h='<div class="card"><h2>04 · Elige la línea de investigación de Ingeniería</h2>'+
      '<div class="lineList">'+lo+'</div>'+
      '<div class="actions"><button class="btnGhost" onclick="go(3)">← Atrás</button>'+
      '<button class="btn" onclick="p4next()" '+(S.lineaIdx===null?'disabled':'')+'>Continuar al tema →</button></div></div>';
  }
  else if(S.paso===5){
    S.tema = S.tema || armarTema();
    h='<div class="card"><h2>05 · Tema de investigación</h2>'+
      '<p class="note">El tema combina tu propósito con la línea, la empresa y el periodo. Puedes editarlo.</p>'+
      '<div class="temaResLbl">Tema</div>'+
      '<textarea rows="3" id="f_tema" style="font-family:Poppins,sans-serif;font-size:16px;">'+esc(S.tema)+'</textarea>'+
      '<div class="actions"><button class="btnGhost" onclick="go(4)">← Cambiar línea</button>'+
      '<button class="btn" onclick="p5next()">Continuar →</button></div></div>';
  }
  else if(S.paso===6){
    h='<div class="card"><h2>06 · Problema general</h2>'+
      '<p class="note">Redáctalo con la fórmula: ¿De qué manera [línea] mejora [indicador] en la empresa '+esc(S.empresa||'[Nombre]')+', '+esc(S.ubicacion||'[lugar]')+', '+anio()+'?</p>'+
      '<textarea rows="3" id="f_pg" style="font-style:italic;" placeholder="¿De qué manera… mejora… en la empresa '+esc(S.empresa||'[Nombre]')+', '+esc(S.ubicacion||'[lugar]')+', '+anio()+'?">'+esc(S.problemaGeneral)+'</textarea>'+
      '<div class="actions"><button class="btnGhost" onclick="go(5)">← Volver al tema</button>'+
      '<button class="btn" onclick="p6next()">Continuar al Ishikawa →</button></div></div>';
  }
  else if(S.paso===7){
    var boxes='';
    CATEGORIAS.forEach(function(cat){
      var items='';
      S.causas[cat].forEach(function(cz,idx){
        items+='<div class="causa"><span>'+esc(cz)+'</span><button onclick="quitarCausa(\''+cat+'\','+idx+')">×</button></div>';
      });
      boxes+='<div class="catBox"><div class="catTitle">'+cat+'</div>'+items+
             '<input class="addInput" style="width:100%;" placeholder="+ causa" onkeydown="if(event.key===\'Enter\'){agregarCausa(\''+cat+'\',this.value);this.value=\'\';}"></div>';
    });
    h='<div class="card"><h2>07 · Diagrama de Ishikawa (6M)</h2>'+
      '<p class="note">El problema central es el problema identificado en la empresa. Agrega o edita las causas por categoría.</p>'+
      '<div class="fishCenter"><span class="fishLabel">Problema central (empresa):</span>'+esc(S.problemaEmpresa||'—')+'</div>'+
      '<div class="grid6">'+boxes+'</div>'+
      '<div class="actions"><button class="btnGhost" onclick="go(6)">← Atrás</button>'+
      '<button class="btn" onclick="p7next()">Continuar →</button></div></div>';
  }
  else if(S.paso===8){
    var pe='';
    S.especificos.forEach(function(e,i){
      pe+='<div class="peItem"><div class="peHead"><span class="peTag">PE'+(i+1)+'</span><span class="peCat">'+e.categoria+'</span></div>'+
          '<div class="note" style="margin:0 0 6px;">↳ causa: '+esc(e.causa)+'</div>'+
          '<textarea rows="2" class="peProblem" style="font-weight:500;" oninput="S.especificos['+i+'].problema=this.value" placeholder="Problema específico derivado de esta causa…">'+esc(e.problema)+'</textarea>'+
          '<label>Herramienta enmarcada en la línea</label>'+
          '<input value="'+esc(e.herramienta)+'" oninput="S.especificos['+i+'].herramienta=this.value" placeholder="Técnica o herramienta…"></div>';
    });
    if(!pe) pe='<p class="note">No hay causas en el Ishikawa. Vuelve al paso anterior y agrega causas.</p>';
    h='<div class="card"><h2>08 · Problemas específicos y herramientas</h2>'+
      '<p class="note">Cada causa del Ishikawa genera un problema específico. Complétalo con su herramienta enmarcada en la línea.</p>'+
      pe+
      '<div class="blockLbl" style="margin-top:20px;">◆ Identificación (para guardar)</div>'+
      '<div class="row2"><div><label>Estudiante / grupo</label><input id="f_est" value="'+esc(S.estudiante)+'" placeholder="Ej. Grupo 3 - Apellidos"></div>'+
      '<div><label>Curso</label><input id="f_curso" value="'+esc(S.curso)+'" placeholder="Ej. TII / DEPI"></div></div>'+
      '<div class="actions"><button class="btnGhost" onclick="go(7)">← Volver al Ishikawa</button>'+
      '<button class="btn" onclick="guardar()" id="btnGuardar">Guardar en QuintaDB</button></div></div>';
  }
  c.innerHTML=h;
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function go(n){ S.paso=n; render(); window.scrollTo(0,0); }

// ---- navegación con captura de campos ----
function p1next(){ S.problemaEmpresa=val('f_prob'); if(!S.problemaEmpresa.trim())return toast('Describe el problema',true); go(2); }
function p2next(){
  S.empresa=val('f_emp'); S.ubicacion=val('f_ubi'); S.mapsLink=val('f_map');
  S.pretest=val('f_pre'); S.test=val('f_tst'); S.postest=val('f_pos');
  if(!S.empresa.trim())return toast('Indica la empresa',true);
  if(!S.pretest.trim())return toast('Indica al menos el Pretest',true);
  go(3);
}
function p3next(){ S.proposito=val('f_prop'); if(!S.proposito.trim())return toast('Escribe el propósito',true); go(4); }
function selLinea(i){ S.lineaIdx=i; S.adoptada=null; render(); }
function p4next(){ if(S.lineaIdx===null)return; if(!S.adoptada)S.adoptada={texto:LINEAS[S.lineaIdx],origen:'oficial'}; S.tema=armarTema(); go(5); }
function p5next(){ S.tema=val('f_tema'); go(6); }
function p6next(){ S.problemaGeneral=val('f_pg'); if(!S.problemaGeneral.trim())return toast('Redacta el problema general',true); armarEspecificos(); go(7); }
function p7next(){
  var total=0; CATEGORIAS.forEach(function(c){ total+=S.causas[c].length; });
  if(total===0)return toast('Agrega al menos una causa',true);
  armarEspecificos(); go(8);
}
function val(id){ var e=document.getElementById(id); return e?e.value:''; }

function onMaps(){
  S.mapsLink=val('f_map');
  var coords=extraerCoords(S.mapsLink);
  var info=document.getElementById('mapInfo'), h='';
  if(S.mapsLink && !coords){
    h='<div class="hintWarn">No se detectaron coordenadas. Copia el link desde la barra de direcciones de Google Maps (trae @lat,long), o escribe "lat, long".</div>';
  } else if(coords){
    h='<div class="coordsBox">Coordenadas detectadas (se guardan en QuintaDB): <b>'+coords+'</b>'+
      '<a class="mapLink" href="'+esc(S.mapsLink)+'" target="_blank" rel="noreferrer">↗ Abrir</a></div>';
  }
  info.innerHTML=h;
}

function agregarCausa(cat,v){ if(!v.trim())return; S.causas[cat].push(v.trim()); render(); }
function quitarCausa(cat,i){ S.causas[cat].splice(i,1); render(); }

// Construye problemas específicos desde las causas (preservando lo ya editado)
function armarEspecificos(){
  var previos={};
  S.especificos.forEach(function(e){ previos[e.categoria+'|'+e.causa]=e; });
  var lista=[];
  CATEGORIAS.forEach(function(cat){
    S.causas[cat].forEach(function(cz){
      var k=cat+'|'+cz;
      lista.push(previos[k] || {categoria:cat, causa:cz, problema:'', herramienta:''});
    });
  });
  S.especificos=lista;
}

// Serializa los específicos a texto (uno por línea) para el campo de QuintaDB
function serializarEspecificos(){
  return S.especificos.map(function(e,i){
    return 'PE'+(i+1)+' ['+e.categoria+'] '+(e.problema||'') +' || Herramienta: '+(e.herramienta||'');
  }).join('\n');
}

// ============================================================
//  GUARDAR (POST al proxy)
// ============================================================
function guardar(){
  S.estudiante=val('f_est'); S.curso=val('f_curso');
  var btn=document.getElementById('btnGuardar');
  btn.disabled=true; btn.textContent='Guardando…';

  var hoy=new Date();
  var fecha=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  var origen = S.adoptada && S.adoptada.origen==='IA' ? ('IA-'+S.adoptada.tipo) : 'oficial';

  var payload={
    problema_empresarial:S.problemaEmpresa,
    empresa:S.empresa,
    ubicacion:S.ubicacion,
    mapa:extraerCoords(S.mapsLink)||S.mapsLink,
    pretest:S.pretest, test:S.test, postest:S.postest,
    proposito:S.proposito,
    linea:lineaTexto(),
    origen_linea:origen,
    tema:S.tema,
    problema_general:S.problemaGeneral,
    problemas_especificos:serializarEspecificos(),
    estudiante_grupo:S.estudiante,
    curso:S.curso,
    fecha_registro:fecha
  };

  // Guardado por JSONP vía GET (patrón del ecosistema URP, evita CORS con Apps Script)
  jsonpCall({ payload: encodeURIComponent(JSON.stringify(payload)) }, function(res){
    btn.disabled=false; btn.textContent='Guardar en QuintaDB';
    if(res && res.ok){
      toast('✓ Planteamiento guardado');
      setTimeout(function(){ mostrarTab('lista'); }, 800);
    } else {
      toast('Error al guardar: '+((res&&res.error)||'desconocido'),true);
    }
  }, function(){
    btn.disabled=false; btn.textContent='Guardar en QuintaDB';
    toast('Error de red al guardar',true);
  });
}

// JSONP helper: inyecta un <script> con callback para saltar CORS
var _jsonpId=0;
function jsonpCall(params, onOk, onErr){
  _jsonpId++;
  var cbName='_pi_cb_'+_jsonpId;
  var timer=setTimeout(function(){ cleanup(); if(onErr)onErr(); }, 20000);
  window[cbName]=function(data){ cleanup(); if(onOk)onOk(data); };
  function cleanup(){ clearTimeout(timer); try{delete window[cbName];}catch(e){} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); }
  var qs='callback='+cbName;
  for(var k in params){ qs+='&'+k+'='+params[k]; }
  var sc=document.createElement('script');
  sc.src=PROXY_URL+'?'+qs;
  sc.onerror=function(){ cleanup(); if(onErr)onErr(); };
  document.body.appendChild(sc);
}
function pad(n){ return n<10?'0'+n:''+n; }

// ============================================================
//  LISTAR (GET al proxy)
// ============================================================
function cargarLista(){
  var cont=document.getElementById('listaCont');
  cont.innerHTML='<p class="note">Cargando…</p>';
  jsonpCall({ listar:'1' }, function(res){
    if(!res || !res.ok){ cont.innerHTML='<p class="hintWarn">No se pudo cargar la lista.</p>'; return; }
    var recs = (res.data && res.data.records) ? res.data.records : [];
    if(!recs.length){ cont.innerHTML='<p class="note">Aún no hay planteamientos guardados.</p>'; return; }
    var h='';
    // más recientes primero
    recs.slice().reverse().forEach(function(rec){
      var v=rec.values||{};
      function g(k){ return v[FIELD[k]]||''; }
      h+='<div class="listItem">'+
         '<div class="listMeta"><span class="badge">'+esc(g('curso')||'—')+'</span>'+
         '<span>'+esc(g('estudiante_grupo')||'—')+'</span>'+
         '<span>'+esc(g('empresa')||'')+'</span>'+
         '<span>'+esc(g('fecha_registro')||'')+'</span></div>'+
         '<div class="listTema">'+esc(g('tema')||g('problema_general')||'(sin tema)')+'</div>'+
         '<div class="listPg">'+esc(g('problema_general')||'')+'</div>'+
         '</div>';
    });
    cont.innerHTML=h;
  }, function(){ cont.innerHTML='<p class="hintWarn">Error de red al cargar.</p>'; });
}

// ============================================================
//  TOAST
// ============================================================
var toastTimer;
function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.className='toast'+(err?' err':''); },3000);
}

// init
render();
</script>
