<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planteamiento Investigativo — Ingeniería URP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2a33; --paper:#eef1ec; --amber:#c8743b; --teal:#2f6d6a; --line:#c9cfc6;
  }
  *{box-sizing:border-box;}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--paper);color:var(--ink);
       margin:0;line-height:1.5;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px;}
  .kicker{font-family:'Poppins',sans-serif;font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--amber);margin-bottom:10px;}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:32px;line-height:1.15;margin:0 0 10px;}
  .sub{max-width:620px;color:#4a5a60;margin:0 0 24px;}
  /* stepper */
  .stepper{display:flex;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:24px;}
  .step{display:flex;align-items:center;gap:6px;flex:1;min-width:84px;}
  .stepClick{cursor:pointer;}
  .stepClick:hover .dot{border-color:var(--ink);}
  .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-family:'Poppins',sans-serif;background:#fff;flex-shrink:0;}
  .dot.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .step span{font-size:11.5px;color:#8a948f;}
  .step span.on{color:var(--ink);font-weight:600;}
  /* card */
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:26px;margin-bottom:18px;box-shadow:0 1px 0 rgba(0,0,0,.03);}
  h2{font-family:'Poppins',sans-serif;font-size:18px;font-weight:600;margin:0 0 16px;}
  label{display:block;font-family:'Poppins',sans-serif;font-size:13.5px;letter-spacing:.06em;color:#6a746f;margin:10px 0 6px;text-transform:uppercase;}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:4px;padding:11px 12px;font-size:16.5px;color:var(--ink);font-family:'Poppins',sans-serif;}
  textarea{resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .note{font-size:14.5px;color:#6a746f;margin:0 0 14px;}
  .blockLbl{font-family:'Poppins',sans-serif;font-size:13px;color:var(--teal);font-weight:500;margin:0 0 4px;}
  .actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px;align-items:center;}
  button{cursor:pointer;transition:transform .08s,opacity .15s;font-family:'Poppins',sans-serif;}
  button:hover:not(:disabled){transform:translateY(-1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:4px;padding:11px 20px;font-size:14px;font-weight:600;}
  .btnGhost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:11px 18px;font-size:14px;font-weight:500;}
  .lineList{display:flex;flex-direction:column;gap:6px;}
  .lineOpt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#fff;border-radius:4px;padding:10px 12px;font-size:14px;color:var(--ink);width:100%;}
  .lineOpt.sel{border-color:var(--teal);background:#eef5f4;box-shadow:inset 3px 0 0 var(--teal);}
  .lineNum{font-family:'Poppins',sans-serif;color:var(--amber);font-size:13px;min-width:18px;}
  .coordsBox{margin-top:8px;padding:10px 14px;background:#eef5f4;border-radius:4px;font-size:14.5px;}
  .coordsBox b{font-family:'Poppins',sans-serif;}
  .hintWarn{font-size:12px;color:#9a3b2c;margin-top:6px;}
  .mapLink{color:var(--teal);font-size:13px;margin-left:10px;}
  .temaResult{background:var(--ink);color:#fff;border-radius:4px;padding:16px 18px;font-size:16px;font-family:'Poppins',sans-serif;line-height:1.4;margin-top:8px;}
  .temaResLbl{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  .fishCenter{background:var(--ink);color:#fff;border-radius:4px;padding:12px 16px;font-style:italic;margin-bottom:16px;font-size:14px;}
  .fishLabel{font-family:'Poppins',sans-serif;font-size:11px;color:var(--amber);font-style:normal;letter-spacing:.04em;display:block;margin-bottom:4px;}
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .catBox{border:1px solid var(--line);border-radius:4px;padding:12px;background:#fafbf9;}
  .catTitle{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);margin-bottom:8px;}
  .causa{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 8px;margin-bottom:3px;}
  .causa button{border:none;background:transparent;color:#b04a3a;font-size:16px;line-height:1;padding:0;}
  .causaWrap{margin-bottom:8px;}
  .subList{padding-left:12px;margin-top:2px;}
  .subcausa{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;font-size:12px;color:#5c584c;background:#f4f6f2;border:1px solid var(--line);border-radius:3px;padding:3px 7px;margin-bottom:3px;}
  .subcausa button{border:none;background:transparent;color:#b04a3a;font-size:14px;line-height:1;padding:0;}
  .addSub{font-size:12px;width:100%;margin-top:2px;}
  .catTitleRow{display:flex;gap:4px;align-items:center;margin-bottom:8px;}
  .catEdit{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);font-weight:600;border:1px solid transparent;background:transparent;padding:2px 4px;border-radius:3px;flex:1;}
  .catEdit:hover,.catEdit:focus{border-color:var(--line);background:#fff;}
  .catDel{border:none;background:transparent;color:#b04a3a;font-size:16px;line-height:1;padding:0 4px;cursor:pointer;}
  .parTable{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
  .parTable th{background:var(--ink);color:#fff;font-family:'Poppins',sans-serif;font-weight:500;font-size:12px;padding:8px;text-align:left;}
  .parTable th:not(:first-child){text-align:center;}
  .parTable td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top;}
  .parTable .prMeta{font-size:11px;color:#8a948f;margin-top:2px;}
  .parTable .prRow{background:#eef5f4;}
  .freqInp{width:64px;text-align:center;padding:4px;font-size:13px;}
  .prTag{background:var(--teal);color:#fff;font-family:'Poppins',sans-serif;font-size:11px;padding:2px 7px;border-radius:3px;}
  .p80{background:#f6e9d8;color:var(--amber);font-size:11px;padding:2px 7px;border-radius:3px;}
  .ejParTable{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;}
  .ejParTable th{background:#d8d2c0;color:var(--ink);padding:5px 8px;text-align:left;font-family:'Poppins',sans-serif;font-weight:500;}
  .ejParTable td{border-bottom:1px solid #ddd;padding:5px 8px;}
  .ejParTable .ejHot{background:#fdf3e7;}
  .ejParTable .ejHot td{font-weight:500;}
  .addInput{border:1px dashed var(--line);border-radius:3px;padding:6px 8px;font-size:13px;background:transparent;}
  .peItem{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:4px;padding:14px;margin-bottom:12px;}
  .peHead{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
  .peTag{font-family:'Poppins',sans-serif;background:var(--ink);color:#fff;font-size:12px;padding:2px 8px;border-radius:3px;}
  .peCat{font-family:'Poppins',sans-serif;font-size:12px;color:var(--amber);}
  .peProblem{font-size:15px;font-weight:500;margin-bottom:8px;}
  .peTool{font-size:13px;color:var(--teal);background:#eef5f4;padding:6px 10px;border-radius:4px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .toast.err{background:#9a3b2c;}
  /* tabs */
  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:14px;font-weight:500;}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  /* lista */
  .listItem{border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px;background:#fff;}
  .listMeta{font-family:'Poppins',sans-serif;font-size:12px;color:#8a948f;margin-bottom:6px;display:flex;gap:12px;flex-wrap:wrap;}
  .listTema{font-family:'Poppins',sans-serif;font-size:15px;margin-bottom:6px;}
  .listPg{font-size:13px;color:#4a5a60;}
  .badge{background:#eef5f4;color:var(--teal);padding:2px 8px;border-radius:20px;font-size:11px;}
  .ejBtn{background:none;border:1px solid var(--teal);color:var(--teal);border-radius:3px;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;}
  .ejBtn:hover{background:#eef5f4;}
  .ejBox{background:#f4f6f2;border-left:3px solid var(--amber);padding:10px 14px;margin:0 0 8px;font-size:14.5px;color:#555f5a;line-height:1.55;border-radius:3px;}
  .grupoBar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin-bottom:16px;}
  .grupoBar .info{font-size:13px;color:#4a5a60;display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;}
  .grupoBar .info b{color:var(--ink);}
  .grupoBar .info .cy{background:#eef5f4;color:var(--teal);padding:2px 8px;border-radius:20px;font-size:12px;}
  .grupoBar .acts{display:flex;gap:8px;}
  .btnSave{background:var(--teal);color:#fff;border:none;border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600;}
  .btnMini{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13px;}
  @media(max-width:680px){.grid6{grid-template-columns:1fr 1fr;}.row2,.row3{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">URP · INGENIERÍA · LÍNEAS DE INVESTIGACIÓN 2026–2030</div>
  <h1>Del problema empresarial al planteamiento</h1>
  <p class="sub">Define problema y delimitaciones, fija el propósito, ancla en una línea oficial, arma el tema, formula el problema general y derívalo en un Ishikawa.</p>

  <div class="tabs">
    <button class="tab on" id="tabFlujo" onclick="mostrarTab('flujo')">Nuevo planteamiento</button>
    <button class="tab" id="tabLista" onclick="mostrarTab('lista')">Planteamientos guardados</button>
  </div>

  <!-- ============ VISTA FLUJO ============ -->
  <div id="vistaFlujo">
    <div class="stepper" id="stepper"></div>
    <div id="grupoBar"></div>
    <div id="pasos"></div>
  </div>

  <!-- ============ VISTA LISTA ============ -->
  <div id="vistaLista" style="display:none;">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <h2 style="margin:0;">Planteamientos guardados</h2>
        <button class="btnGhost" onclick="cargarLista()">↻ Actualizar</button>
      </div>
      <div id="listaCont" style="margin-top:16px;"><p class="note">Cargando…</p></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIGURACIÓN
// ============================================================
var PROXY_URL = "https://script.google.com/macros/s/AKfycbyeMZERRsQNsSUsdKet60IqndE2QWc_rORm0n6dFml7Gnf9-8ZEp71ZSuuWKurQM2JV/exec";

// Habilitar cuando actives la IA en el proxy (ruta action=ia).
var IA_ACTIVA = true;

// Field IDs de QuintaDB (para leer registros en la vista de lista)
var FIELD = {
  problema_empresarial : 'a2lZZdKmjctPLGBfJcGJWS',
  empresa              : 'cCDSkvW6TcNyo-WRq7bCk4',
  ubicacion            : 'b7cmoanCjfW6BcNsjrkSo7',
  mapa                 : 'ddOSoOo8jjW50fWOaWntGQ',
  pretest              : 'btW4hdNYbeW4pcHwWpzmkV',
  test                 : 'ddVHFdTCjndOoRW6ScWOfV',
  postest              : 'cqj8oCqYnnxldcNGGvW6SU',
  proposito            : 'bWD8o5W4bbx7r6W7fydmoA',
  linea                : 'ddLIhdOmjnuOoTnCkAW6jz',
  origen_linea         : 'ddLSkDn8nab6JcSXT8xmkE',
  tema                 : 'cUfSonW7DoW7BcRJhcNxjP',
  problema_general     : 'dcPuBdImjkW4FdHrRdGSoE',
  problemas_especificos: 'ddTbpdUCjiW6flW5W0WPvR',
  estudiante_grupo     : 'cuW51jWQTpWRyjbmkWmmoQ',
  curso                : 'cZlIbGW6jiaOoZW4hcL8oR',
  fecha_registro       : 'ddKCoGv8nkdikTW7n-m8ot',
  ciclo                : 'bVrvWbW45cVyk1lSkmkSoq',
  numero_grupo         : 'cprSkAWRDdR4kRpmksqw82',
  coordinador          : 'cCWQqVWOfdSikDWOLHt8kq',
  estructura           : 'cbW64-W5XcTRq3nmk4emkk',
  consecuencia         : 'dcPMhdICnnW6C5WRaHuSk7'
};

// ============================================================
//  DATOS: 14 líneas de Ingeniería URP 2026-2030
// ============================================================
var LINEAS = [
  "Ingeniería estructural y de materiales",
  "Ingeniería hidráulica y gestión de recursos hídricos",
  "Mecánica de suelos, geotecnia y pavimentos",
  "Planeamiento y optimización de procesos (T)",
  "Sostenibilidad, eficiencia energética y evaluación del impacto ambiental (T)",
  "Ingeniería vial y gestión del transporte",
  "Planeamiento, gestión de operaciones, cadena de suministro y excelencia operacional",
  "Procesamiento digital, visión artificial y sistemas embebidos",
  "Control y automatización de procesos",
  "Diseño, manufactura e ingeniería asistida por computadora, CAD/CAM/CAE",
  "Robótica, sistemas mecatrónicos, biomecatrónicos y dispositivos médicos",
  "Inteligencia artificial, ciencia de datos y sistemas inteligentes (T)",
  "Ingeniería de software (T)",
  "Sistemas de información y tecnologías de información"
];
var CATEGORIAS = ["Mano de obra","Maquinaria","Método","Material","Medición","Medio ambiente"];
var PASOS_NOMBRES = ["Problema","Delimitación","Propósito","Línea","Tema","General","Ishikawa","Pareto","Específicos"];

// Datos institucionales fijos (no editables por el usuario)
var CURSO_FIJO = "Taller de Investigación en Ingeniería I";
var PROFESOR_FIJO = "Mg. Ing. Patrick Horacio Villanueva Bartra";
// Ciclos disponibles en el desplegable
var CICLOS = ["2026-2","2027-1","2027-2","2028-1","2028-2","2029-1","2029-2"];

// Ejemplos guía por aspecto del problema (Manual URP 2020, p.8).
// Basados en un caso real del curso (empresa reservada).
var EJEMPLO_PROB = {
  pob: "Los tres analistas y el jefe del área de adquisiciones, y detrás de ellos las áreas usuarias —producción, mantenimiento y almacén— que no pueden operar cuando el material que solicitaron no llega a tiempo.",
  cau: "Cada analista lleva su propia hoja de cálculo y no comparte la información con el resto del equipo; las órdenes se aprueban de palabra y recién se documentan cuando el material ya llegó; los pedidos se atienden en el orden en que entran, sin distinguir cuáles son urgentes; y una vez emitida la orden, nadie vuelve a revisar si el proveedor cumplió la fecha acordada.",
  con: "Las áreas usuarias reciben sus materiales con retraso y detienen sus operaciones; para cubrir la urgencia, el área compra a sobreprecio y sin negociar; y como cada quien maneja su propia hoja, se pierde el rastro de qué se pidió, a quién y en qué estado quedó.",
  ctx: "Ocurre de forma sostenida en la sede principal y se agrava en los cierres de mes, cuando varias áreas solicitan compras al mismo tiempo y el equipo las atiende sin un criterio claro de prioridad.",
  mag: "En el último semestre, 38 de cada 100 órdenes de compra llegaron con más de 5 días hábiles de retraso frente a la fecha comprometida, lo que obligó a compras urgentes a sobreprecio y encareció el abastecimiento del período."
};
function toggleEj(id){
  var el=document.getElementById('ej_'+id);
  if(el) el.style.display = (el.style.display==='none'||!el.style.display) ? 'block' : 'none';
}

function limpiarLinea(l){ return l.replace(/\s*\(T\)\s*$/,'').trim(); }

// Consolida los 5 aspectos del problema (Manual URP 2020, p.8) en un texto único.
// Ese texto es el que usa el Ishikawa (efecto central), el payload y la lista.
function consolidarProblema(){
  var partes=[];
  if(S.probPoblacion)     partes.push('Población afectada: '+S.probPoblacion.trim());
  if(S.probCausas)        partes.push('Posibles causas raíz: '+S.probCausas.trim());
  if(S.probConsecuencias) partes.push('Consecuencias: '+S.probConsecuencias.trim());
  if(S.probContexto)      partes.push('Dónde/cómo/cuándo se manifiesta: '+S.probContexto.trim());
  if(S.probMagnitud)      partes.push('Magnitud del problema: '+S.probMagnitud.trim());
  S.problemaEmpresa = partes.join('\n');
  return S.problemaEmpresa;
}
// Cuántos de los 5 aspectos tienen contenido (al menos unos caracteres).
function aspectosCompletos(){
  var xs=[S.probPoblacion,S.probCausas,S.probConsecuencias,S.probContexto,S.probMagnitud];
  return xs.filter(function(x){ return (x||'').trim().length>=3; }).length;
}
function extraerCoords(url){
  if(!url) return '';
  var t=url.trim();
  var m = t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/) || t.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(m) return m[1]+','+m[2];
  var d=t.match(/^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/);
  if(d) return d[1]+','+d[2];
  return '';
}

// ============================================================
//  ESTADO
// ============================================================
var S = {
  paso:0,
  // Registro del grupo (paso 0)
  ciclo:'', numeroGrupo:'', coordinador:'',
  // Descripción del problema — 5 aspectos exigidos por el Manual URP 2020 (p.8)
  probPoblacion:'', probCausas:'', probConsecuencias:'', probContexto:'', probMagnitud:'',
  problemaEmpresa:'', empresa:'', ubicacion:'', mapsLink:'',
  pretest:'', test:'', postest:'',
  proposito:'', lineaIdx:null, adoptada:null, lineaCustom:false, lineaCustomTexto:'',
  tema:'', problemaGeneral:'', efectoCentral:'', consecuenciaSintoma:'',
  categorias: CATEGORIAS.slice(),   // 6M editables
  causas:{}, especificos:[],
  nivelPareto:'causa',  // 'causa' (1.º nivel) o 'subcausa' (2.º nivel) — lo elige el grupo
  paretoFreq:{},        // clave "categoria|causa|subcausa" -> frecuencia (número)
  priorizadas:[],       // hasta 3 elementos priorizados {categoria,causa,sub}
  estudiante:'', curso:'', recordId:null
};
S.categorias.forEach(function(c){ S.causas[c]=[]; });   // cada causa: {txt, subs:[]}

function lineaTexto(){
  if(S.lineaCustom) return S.lineaCustomTexto ? S.lineaCustomTexto.trim() : null;
  var l = S.adoptada ? S.adoptada.texto : (S.lineaIdx!==null?LINEAS[S.lineaIdx]:null);
  return l ? limpiarLinea(l) : null;
}
function periodo(){
  if(S.pretest && S.postest) return S.pretest+' – '+S.postest;
  return S.pretest||S.postest||'[periodo]';
}
function anio(){
  var t=(S.pretest||S.test||S.postest||'');
  var m=t.match(/(20\d{2}|19\d{2})/); return m?m[1]:'[año]';
}
function armarTema(){
  if(!S.proposito || !lineaTexto()) return '';
  var p = S.proposito.trim().replace(/\.?\s*$/,'');
  return p+' mediante '+lineaTexto()+' en la empresa '+(S.empresa||'[Empresa]')+' en el periodo '+periodo();
}

// ============================================================
//  RENDER
// ============================================================
function mostrarTab(cual){
  document.getElementById('vistaFlujo').style.display = cual==='flujo'?'block':'none';
  document.getElementById('vistaLista').style.display = cual==='lista'?'block':'none';
  document.getElementById('tabFlujo').classList.toggle('on', cual==='flujo');
  document.getElementById('tabLista').classList.toggle('on', cual==='lista');
  if(cual==='lista') cargarLista();
}

function renderStepper(){
  var st=document.getElementById('stepper');
  if(S.paso<1){ st.innerHTML=''; st.style.display='none'; return; }
  st.style.display='flex';
  var h='';
  for(var i=0;i<PASOS_NOMBRES.length;i++){
    var n=i+1;
    h+='<div class="step stepClick" onclick="irAPaso('+n+')" title="Ir al paso '+n+'"><div class="dot '+(n<=S.paso?'on':'')+'">'+n+'</div>'+
       '<span class="'+(n===S.paso?'on':'')+'">'+PASOS_NOMBRES[i]+'</span></div>';
  }

// Navegación directa desde el menú de pasos (captura el paso actual antes de saltar)
function irAPaso(n){
  if(n===S.paso) return;
  capturarPasoActual();
  // Si vamos hacia (o más allá de) Pareto/Específicos, aseguramos derivar datos
  if(n>=8) armarPareto();
  if(n>=9) armarEspecificos();
  go(n);
}

    armarEspecificos();
    var pe='';
    S.especificos.forEach(function(e,i){
      var subTxt = e.sub ? '<div class="note" style="margin:0 0 6px;color:#8a948f;">subcausa priorizada: '+esc(e.sub)+'</div>' : '';
      pe+='<div class="peItem"><div class="peHead"><span class="peTag">PE'+(i+1)+'</span><span class="peCat">'+esc(e.categoria)+'</span></div>'+
          '<div class="note" style="margin:0 0 6px;">↳ causa: '+esc(e.causa)+'</div>'+
          subTxt+
          '<textarea rows="2" class="peProblem" style="font-weight:500;" oninput="S.especificos['+i+'].problema=this.value" placeholder="Problema espec\u00edfico derivado de esta causa\u2026">'+esc(e.problema)+'</textarea>'+
          '<label>Herramienta enmarcada en la línea</label>'+
          '<input value="'+esc(e.herramienta)+'" oninput="S.especificos['+i+'].herramienta=this.value" placeholder="Técnica o herramienta…"></div>';
    });
    if(!pe) pe='<p class="note">No hay '+rotuloNivel(true)+' priorizadas. Vuelve al Pareto (paso 8) y prioriza 3.</p>';
    h='<div class="card"><h2>09 · Problemas específicos y herramientas</h2>'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">'+
      '<p class="note" style="margin:0;">Cada '+rotuloNivel()+' priorizada en el Pareto genera un problema espec\u00edfico. Compl\u00e9talo con su herramienta enmarcada en la l\u00ednea.</p>'+

      pe+
      '<div class="blockLbl" style="margin-top:20px;">◆ Identificación (registrada al inicio)</div>'+
      '<div class="coordsBox" style="background:#eef5f4;">'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px 24px;">'+
      '<span><b>Ciclo:</b> '+esc(S.ciclo||'—')+'</span>'+
      '<span><b>Grupo N°:</b> '+esc(S.numeroGrupo||'—')+'</span>'+
      '<span><b>Coordinador(a):</b> '+esc(S.coordinador||'—')+'</span></div>'+
      '<div style="margin-top:6px;font-size:13px;color:#6a746f;">'+esc(CURSO_FIJO)+' · '+esc(PROFESOR_FIJO)+'</div>'+
      '<button type="button" class="ejBtn" style="margin-top:8px;" onclick="go(0)">editar datos del grupo</button></div>'+
      '<div class="actions"><button class="btnGhost" onclick="go(8)">← Volver al Pareto</button>'+
      '<button class="btn" onclick="guardar()" id="btnGuardar">Guardar en QuintaDB</button></div></div>';
  }
  c.innerHTML=h;
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var ok = n>=3;
  var color = ok ? 'var(--teal)' : '#8a948f';
  var dot   = ok ? 'var(--teal)' : 'var(--line)';
  var req   = ok ? 'requisito cumplido' : 'completa al menos 3 de 5 para continuar';
  return '<span style="width:8px;height:8px;border-radius:50%;background:'+dot+';display:inline-block;"></span>'+
         '<span style="color:'+color+';font-weight:'+(ok?'600':'400')+';">'+n+' / 5 aspectos documentados</span>'+
         '<span style="color:#8a948f;font-size:11.5px;">· '+req+'</span>';
}

      S.lineaCustomTexto = res.texto.trim();
      render();

      toast('No se pudo generar la sugerencia'+((res&&res.error)?': '+res.error:''),true);

// Dibuja un Ishikawa (pescado) en canvas y devuelve el dataURL PNG.
// cats: [{nombre, causas:[{txt, subs:[...]}]}]
// prior: [{categoria, causa, sub}]  — se resalta la CAUSA (o subcausa) priorizada,
// no la categoría entera: la categoría es un cajón de clasificación, no una causa.
function construirIshikawaPNG(efecto, cats, titulo, prior, consecuencia){
  prior = (prior||[]).filter(function(p){ return p && p.categoria; });
  cats = (cats||[]).filter(function(c){ return (c.causas||[]).length>0; });
  if(!cats.length) cats = [{nombre:'(sin categorías)', causas:[]}];

  // ---- Tipografías (en px del lienzo). Se subieron todas para que el
  //      diagrama se lea sin ampliar, respetando el ancho del recuadro.
  var F_TIT=30, F_EFECTO=25, F_CAT=23, F_CAUSA=20, F_SUB=17, F_CONS=18, F_CONSLBL=16, F_LEG=18;
  var LH_CAUSA=25, LH_SUB=21, LH_CONS=24;

  // ---- Parámetros de espacio horizontal ----
  var MARG_L=18;            // margen izquierdo del lienzo
  var TEXTO_ANCHO=300;      // ancho reservado a la izquierda de cada rama para sus causas
  var SEPARACION=350;       // separación horizontal entre ramas del mismo lado
  var HEAD_W=280;           // ancho de la cabeza (efecto)
  var DX=70;                // desplazamiento horizontal de la diagonal
  var CONECTOR=80;          // largo del guion horizontal de cada causa

  var arriba=[], abajo=[];
  cats.forEach(function(c,i){ (i%2===0?arriba:abajo).push(c); });
  var maxRamas = Math.max(arriba.length, abajo.length);

  var spineX0 = MARG_L + 22;
  var bx0 = MARG_L + TEXTO_ANCHO + CONECTOR + DX;                       // x de la primera rama
  var spineX1 = bx0 + SEPARACION*(maxRamas-1) + 70;     // fin de la espina
  var W = spineX1 + HEAD_W + 26;

  // ---- Lienzo temporal solo para medir texto ----
  var mcv=document.createElement('canvas'), m=mcv.getContext('2d');

  // Parte el texto en líneas que quepan en maxW (por medición real, no por nº de letras)
  function partir(ctx,text,maxW,maxLines){
    var words=String(text||'').split(/\s+/), lines=[], line='';
    for(var i=0;i<words.length;i++){
      var test = line ? line+' '+words[i] : words[i];
      if(ctx.measureText(test).width > maxW && line){
        lines.push(line); line=words[i];
        if(lines.length===maxLines-1 && i<words.length-1){
          // última línea permitida: mete lo que quede y recorta con …
          var resto=words.slice(i).join(' ');
          while(resto && ctx.measureText(resto+'…').width>maxW) resto=resto.slice(0,-1);
          lines.push(resto+'…'); return lines;
        }
      } else { line=test; }
    }
    if(line) lines.push(line);
    return lines.slice(0,maxLines);
  }

  // Ancho de texto disponible para las causas de una rama (no invade la rama vecina)
  var anchoTexto = Math.min(TEXTO_ANCHO - 46, SEPARACION - CONECTOR - 60);

  // Alto que ocupa cada causa (texto + subcausas) para repartir la diagonal
  function altoCausa(cz){
    m.font=F_CAUSA+'px Arial';
    var l = partir(m, cz.txt||cz, anchoTexto, 3).length;
    var ns = (cz.subs||[]).length;
    return l*LH_CAUSA + ns*LH_SUB + 16;
  }
  function altoRama(lista){
    var t=0; (lista||[]).forEach(function(cz){ t+=altoCausa(cz); });
    return t;
  }
  function altoLado(ramas){
    var mx=210;
    ramas.forEach(function(c){ mx=Math.max(mx, altoRama(c.causas)+70); });
    return mx;
  }
  var BR_UP = altoLado(arriba), BR_DN = altoLado(abajo);

  // ---- Alto del recuadro de consecuencia (arriba a la derecha) ----
  var cbX = spineX1 - 40, cbW = W - cbX - 22, cbY = 68, cbH = 0, consLineas = [];
  if(consecuencia){
    m.font=F_CONS+'px Arial';
    consLineas = partir(m, consecuencia, cbW-24, 5);
    cbH = 42 + consLineas.length*LH_CONS + 12;
  }

  var topY = Math.max(240, cbY + cbH + 40);
  var spineY = topY + BR_UP;
  var H = spineY + BR_DN + 96;

  var cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  var x=cv.getContext('2d');
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);

  // ---- Título ----
  x.fillStyle='#1c2a33'; x.font='italic bold '+F_TIT+'px Georgia';
  x.textAlign='left'; x.textBaseline='alphabetic';
  x.fillText(titulo||'Diagrama de Ishikawa', MARG_L+6, 46);

  // ---- Espina central ----
  x.strokeStyle='#1c2a33'; x.lineWidth=5;
  x.beginPath(); x.moveTo(spineX0,spineY); x.lineTo(spineX1,spineY); x.stroke();

  // ---- Cabeza (efecto) ----
  var headH = Math.min(170, Math.max(120, BR_UP*0.5));
  x.fillStyle='#1c2a33';
  x.beginPath();
  x.moveTo(spineX1, spineY-headH);
  x.quadraticCurveTo(W-16, spineY-headH, W-16, spineY);
  x.quadraticCurveTo(W-16, spineY+headH, spineX1, spineY+headH);
  x.closePath(); x.fill();
  x.fillStyle='#fff'; x.font='bold '+F_EFECTO+'px Arial';
  x.textAlign='center'; x.textBaseline='middle';
  (function(){
    var maxW = (W-16) - spineX1 - 54;
    var lines = partir(x, efecto, maxW, 8);
    var y0 = spineY - ((lines.length-1)*30)/2;
    lines.forEach(function(ln,i){ x.fillText(ln, (spineX1 + (W-16))/2, y0 + i*30); });
  })();

  // ---- Recuadro de consecuencia / síntoma ----
  if(consecuencia){
    x.strokeStyle='#c8743b'; x.lineWidth=2; x.fillStyle='#fdf3e7';
    x.fillRect(cbX,cbY,cbW,cbH); x.strokeRect(cbX,cbY,cbW,cbH);
    x.fillStyle='#a8501e'; x.font='bold '+F_CONSLBL+'px Arial';
    x.textAlign='left'; x.textBaseline='top';
    x.fillText('CONSECUENCIA / SÍNTOMA', cbX+12, cbY+10);
    x.fillStyle='#26241e'; x.font=F_CONS+'px Arial'; x.textBaseline='alphabetic';
    consLineas.forEach(function(ln,i){ x.fillText(ln, cbX+12, cbY+42+ (i+1)*LH_CONS - 6); });
    x.strokeStyle='#c8743b'; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(cbX+cbW/2, cbY+cbH); x.lineTo(cbX+cbW/2, spineY-headH); x.stroke();
  }

  // ---- Ramas ----
  function dibujarRama(cat, bx, up, brH){
    var esPrior = prior.some(function(p){ return p.categoria===cat.nombre; });
    var tipX = bx - DX, tipY = spineY + (up?-1:1)*brH;
    x.strokeStyle = esPrior ? '#c8743b' : '#2f6d6a';
    x.lineWidth   = esPrior ? 6 : 3.5;
    x.beginPath(); x.moveTo(bx,spineY); x.lineTo(tipX,tipY); x.stroke();

    // caja de la categoría
    x.font='bold '+F_CAT+'px Arial'; x.textAlign='center'; x.textBaseline='middle';
    var lw=x.measureText(cat.nombre).width+30, bh=34;
    var boxY = up ? tipY-bh-6 : tipY+6;
    x.fillStyle = esPrior ? '#c8743b' : '#1c2a33';
    // Etiqueta anclada al extremo de la espina (no centrada): así nunca
    // invade el texto de las causas de la rama vecina de la derecha.
    var boxX = tipX - lw + 14;
    x.fillRect(boxX, boxY, lw, bh);
    x.fillStyle='#fff'; x.fillText(cat.nombre, boxX+lw/2, boxY+bh/2);

    // causas repartidas por altura real (no por fracción fija)
    var causas=cat.causas||[];
    var total=altoRama(causas) || 1;
    var acum=0;
    causas.forEach(function(cz){
      var hC=altoCausa(cz);
      var frac=(acum + hC/2)/total;            // centro vertical del bloque
      acum+=hC;
      var px = bx + (tipX-bx)*frac;
      var py = spineY + (tipY-spineY)*frac;
      var czTxt = cz.txt||cz;
      var czPrior = prior.some(function(p){ return p.categoria===cat.nombre && p.causa===czTxt && !p.sub; });
      var czTiene = prior.some(function(p){ return p.categoria===cat.nombre && p.causa===czTxt; });
      x.strokeStyle = czTiene ? '#c8743b' : '#7a8a86';
      x.lineWidth   = czTiene ? 3 : 1.8;
      x.beginPath(); x.moveTo(px,py); x.lineTo(px-CONECTOR,py); x.stroke();

      var rightX = px - CONECTOR - 10;
      var dispo  = Math.min(anchoTexto, rightX - MARG_L);   // nunca sale del lienzo
      x.fillStyle = czTiene ? '#a8501e' : '#26241e';
      x.font = (czTiene?'bold ':'')+F_CAUSA+'px Arial';
      x.textAlign='right'; x.textBaseline='middle';
      var lns = partir(x, cz.txt||cz, dispo, 3);
      var y0 = py - ((lns.length-1)*LH_CAUSA)/2;
      lns.forEach(function(ln,i){ x.fillText(ln, rightX, y0 + i*LH_CAUSA); });

      // subcausas
      var ySub = y0 + lns.length*LH_CAUSA - 2;
      (cz.subs||[]).forEach(function(sb,si){
        var sbPrior = prior.some(function(p){ return p.categoria===cat.nombre && p.causa===czTxt && p.sub===sb; });
        x.fillStyle = sbPrior ? '#a8501e' : '#7d8781';
        x.font = (sbPrior?'bold ':'')+F_SUB+'px Arial';
        var ls = partir(x, '· '+sb, dispo-14, 1);
        x.fillText(ls[0], rightX-10, ySub + si*LH_SUB);
      });
    });
  }

  arriba.forEach(function(cat,i){ dibujarRama(cat, bx0 + SEPARACION*i, true,  BR_UP); });
  abajo .forEach(function(cat,i){ dibujarRama(cat, bx0 + SEPARACION*i, false, BR_DN); });

  // ---- Leyenda ----
  if(prior.length){
    var etq = prior.map(function(p){ return p.sub || p.causa; });
    x.fillStyle='#c8743b'; x.font='bold '+F_LEG+'px Arial';
    x.textAlign='left'; x.textBaseline='alphabetic';
    var leyenda = '\u25a0 Priorizadas (Pareto): '+etq.join('  \u00b7  ');
    while(x.measureText(leyenda).width > W-2*MARG_L-12 && etq.length){
      etq[etq.length-1] = etq[etq.length-1].slice(0,-2)+'\u2026';
      leyenda = '\u25a0 Priorizadas (Pareto): '+etq.join('  \u00b7  ');
      if(etq[etq.length-1].length<=3) break;
    }
    x.fillText(leyenda, MARG_L+6, H-26);
  }
  return cv.toDataURL('image/png');
}
function descargarIshikawa(){
  var cats = S.categorias.map(function(c){ return { nombre:c, causas:(S.causas[c]||[]) }; })
                         .filter(function(c){ return c.causas.length>0; });
  if(!cats.length){ toast('Añade al menos una causa antes de descargar',true); return; }
  var efecto = (S.efectoCentral || S.probConsecuencias || S.probMagnitud || 'Problema central').trim();
  var prior = S.priorizadas.filter(function(p){ return p; });
  var subt = 'Grupo '+(S.numeroGrupo||'')+(S.coordinador?' · '+S.coordinador:'');
  var url=construirIshikawaPNG(efecto, cats, 'Diagrama de Ishikawa \u2014 '+subt, prior, S.consecuenciaSintoma);
  var a=document.createElement('a');
  a.href=url; a.download='ishikawa_grupo_'+(S.numeroGrupo||'')+'.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('Diagrama descargado');
}
function truncar(s,n){ s=String(s||''); return s.length>n? s.slice(0,n-1)+'…' : s; }
function wrapTextLeft(ctx,text,lx,cy,maxW,lh,maxLines){
  var words=String(text).split(' '), lines=[], line='';
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
    else line=test;
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=truncar(lines[maxLines-1],46); }
  lines.forEach(function(ln,i){ ctx.fillText(ln,lx,cy+i*lh); });
}
function wrapText(ctx,text,cx,cy,maxW,lh,maxLines){
  var words=String(text).split(' '), lines=[], line='';
  for(var i=0;i<words.length;i++){
    var test=line?line+' '+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=words[i]; }
    else line=test;
    if(lines.length>=maxLines-1){ line=test; }
  }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines=lines.slice(0,maxLines); lines[maxLines-1]=truncar(lines[maxLines-1],30); }
  var startY=cy-((lines.length-1)*lh)/2;
  lines.forEach(function(ln,i){ ctx.fillText(ln,cx,startY+i*lh); });
}
function subKey(cat,causa,sub){ return cat+'|'+causa+'|'+sub; }

// Reúne todas las subcausas del Ishikawa y sincroniza el mapa de frecuencias
function armarPareto(){
  var vistos={};
  S.categorias.forEach(function(cat){
    (S.causas[cat]||[]).forEach(function(cz){
      // 1.º nivel: la causa (sub vacío)
      var kc=subKey(cat,cz.txt,'');
      vistos[kc]=true;
      if(!(kc in S.paretoFreq)) S.paretoFreq[kc]=1;
      // 2.º nivel: cada subcausa
      (cz.subs||[]).forEach(function(sb){
        var k=subKey(cat,cz.txt,sb);
        vistos[k]=true;
        if(!(k in S.paretoFreq)) S.paretoFreq[k]=1;
      });
    });
  });
  // Limpia frecuencias de elementos ya inexistentes. Se conservan los DOS niveles,
  // para que cambiar de nivel no borre lo ya medido en el otro.
  Object.keys(S.paretoFreq).forEach(function(k){ if(!vistos[k]) delete S.paretoFreq[k]; });
}

function porSubcausa(){ return S.nivelPareto==='subcausa'; }
function rotuloNivel(pl){ return porSubcausa() ? (pl?'subcausas':'subcausa') : (pl?'causas':'causa'); }

// Devuelve los elementos del nivel elegido, ordenados por frecuencia desc
function paretoOrdenado(){
  var arr=[];
  S.categorias.forEach(function(cat){
    (S.causas[cat]||[]).forEach(function(cz){
      if(porSubcausa()){
        (cz.subs||[]).forEach(function(sb){
          var k=subKey(cat,cz.txt,sb);
          arr.push({ key:k, categoria:cat, causa:cz.txt, sub:sb, etiqueta:sb,
                     meta:cat+' \u00b7 '+cz.txt, freq:Number(S.paretoFreq[k]||0) });
        });
      } else {
        var k=subKey(cat,cz.txt,'');
        arr.push({ key:k, categoria:cat, causa:cz.txt, sub:'', etiqueta:cz.txt,
                   meta:cat, freq:Number(S.paretoFreq[k]||0) });
      }
    });
  });
  arr.sort(function(a,b){ return b.freq-a.freq; });
  arr.forEach(function(f){
    f.priorizada=false;
    S.priorizadas.forEach(function(p,pi){
      if(p && subKey(p.categoria,p.causa,p.sub||'')===f.key){ f.priorizada=true; f.prIdx=pi; }
    });
  });
  return arr;
}

function setFreq(key,v){
  S.paretoFreq[key]=Math.max(0, Number(v)||0);
  render();
}

// Cambia el nivel de análisis del Pareto (1.º nivel = causa · 2.º nivel = subcausa)
function setNivelPareto(n){
  if(S.nivelPareto===n) return;
  var hay = S.priorizadas.filter(function(p){ return p; }).length;
  if(hay && !confirm('Cambiar de nivel borra los '+hay+' elementos que ya priorizaste. \u00bfContinuar?')) return;
  S.nivelPareto=n;
  S.priorizadas=[];
  render();
}

// Fija el elemento priorizado en la posición pi (0..2) a partir de su key
function setPriorizada(pi,key){
  if(!key){ S.priorizadas[pi]=null; render(); return; }
  var parts=key.split('|');
  S.priorizadas[pi]={ categoria:parts[0], causa:parts[1], sub:parts[2]||'' };
  render();
}

function p8next(){
  var elegidas=S.priorizadas.filter(function(p){ return p; });
  if(elegidas.length<3) return toast('Selecciona las 3 '+rotuloNivel(true)+' priorizadas',true);
  armarEspecificos(); go(9);
}
function val(id){ var e=document.getElementById(id); return e?e.value:''; }

// Vuelca al estado lo escrito en el paso visible (sin validar), para que
// Guardar/Actualizar o Editar no pierdan cambios no confirmados con Continuar.
function capturarPasoActual(){
  switch(S.paso){
    case 1:
      if(document.getElementById('f_pob')) S.probPoblacion=val('f_pob');
      if(document.getElementById('f_cau')) S.probCausas=val('f_cau');
      if(document.getElementById('f_con')) S.probConsecuencias=val('f_con');
      if(document.getElementById('f_ctx')) S.probContexto=val('f_ctx');
      if(document.getElementById('f_mag')) S.probMagnitud=val('f_mag');
      consolidarProblema();
      break;
    case 2:
      if(document.getElementById('f_emp')) S.empresa=val('f_emp');
      if(document.getElementById('f_ubi')) S.ubicacion=val('f_ubi');
      if(document.getElementById('f_map')) S.mapsLink=val('f_map');
      if(document.getElementById('f_pre')) S.pretest=val('f_pre');
      if(document.getElementById('f_tst')) S.test=val('f_tst');
      if(document.getElementById('f_pos')) S.postest=val('f_pos');
      break;
    case 3:
      if(document.getElementById('f_prop')) S.proposito=val('f_prop');
      break;
    case 4:
      if(document.getElementById('f_lcustom')) S.lineaCustomTexto=val('f_lcustom');
      break;
    case 5:
      if(document.getElementById('f_tema')) S.tema=val('f_tema');
      break;
    case 6:
      if(document.getElementById('f_pg')) S.problemaGeneral=val('f_pg');
      break;
    // 7 (Ishikawa), 8 (Pareto) y 9 (Específicos) guardan en el estado vía oninput/onchange directamente
  }
}

function onMaps(){
  S.mapsLink=val('f_map');
  var coords=extraerCoords(S.mapsLink);
  var info=document.getElementById('mapInfo'), h='';
  if(S.mapsLink && !coords){
    h='<div class="hintWarn">No se detectaron coordenadas. Copia el link desde la barra de direcciones de Google Maps (trae @lat,long), o escribe "lat, long".</div>';
  } else if(coords){
    h='<div class="coordsBox">Coordenadas detectadas (se guardan en QuintaDB): <b>'+coords+'</b>'+
      '<a class="mapLink" href="'+esc(S.mapsLink)+'" target="_blank" rel="noreferrer">↗ Abrir</a></div>';
  }
  info.innerHTML=h;
}

// ---- Ishikawa: categorías, causas y subcausas ----
function catNombre(ci){ return S.categorias[ci]; }
function agregarCausa(ci,v){ if(!v.trim())return; S.causas[catNombre(ci)].push({txt:v.trim(),subs:[]}); render(); }
function quitarCausa(ci,i){ S.causas[catNombre(ci)].splice(i,1); render(); }
function agregarSub(ci,i,v){ if(!v.trim())return; S.causas[catNombre(ci)][i].subs.push(v.trim()); render(); }
function quitarSub(ci,i,si){ S.causas[catNombre(ci)][i].subs.splice(si,1); render(); }

function agregarCategoria(){
  var base='Nueva categoría', nom=base, k=2;
  while(S.categorias.indexOf(nom)!==-1){ nom=base+' '+k; k++; }
  S.categorias.push(nom); S.causas[nom]=[]; render();
}
function quitarCategoria(ci){
  var nom=S.categorias[ci];
  if(!confirm('¿Eliminar la categoría "'+nom+'" y sus causas?')) return;
  S.categorias.splice(ci,1); delete S.causas[nom]; render();
}
function renombrarCategoria(ci,nuevo){
  nuevo=(nuevo||'').trim(); if(!nuevo) { render(); return; }
  var viejo=S.categorias[ci];
  if(nuevo===viejo) return;
  if(S.categorias.indexOf(nuevo)!==-1){ toast('Ya existe una categoría con ese nombre',true); render(); return; }
  S.causas[nuevo]=S.causas[viejo]; delete S.causas[viejo]; S.categorias[ci]=nuevo; render();
}

// Construye 3 problemas específicos desde las subcausas priorizadas en el Pareto
// (preservando problema/herramienta ya editados por subcausa).
function armarEspecificos(){
  var previos={};
  S.especificos.forEach(function(e){ if(e.sub) previos[e.categoria+'|'+e.causa+'|'+e.sub]=e; });
  var lista=[];
  S.priorizadas.forEach(function(p){
    if(!p) return;
    var k=p.categoria+'|'+p.causa+'|'+p.sub;
    lista.push(previos[k] || {categoria:p.categoria, causa:p.causa, sub:p.sub, problema:'', herramienta:''});
  });
  S.especificos=lista;
}

// Serializa los específicos a texto (uno por línea) para el campo de QuintaDB
function serializarEspecificos(){
  return S.especificos.map(function(e,i){
    var sub = e.sub ? ' (subcausa priorizada: '+e.sub+')' : '';
    return 'PE'+(i+1)+' ['+e.categoria+' › '+e.causa+'] '+(e.problema||'')+sub+' || Herramienta: '+(e.herramienta||'');
  }).join('\n');
}

// ============================================================
//  SERIALIZAR / RESTAURAR ESTADO COMPLETO (campo "Estructura completa")
// ============================================================
// Guarda todo lo que no cabe en campos individuales: los 5 aspectos del
// problema, el Ishikawa (categorías + causas + subcausas), las frecuencias
// del Pareto, las 3 priorizadas y los específicos con su herramienta.
function serializarEstado(){
  return JSON.stringify({
    v:1,
    prob:{ pob:S.probPoblacion, cau:S.probCausas, con:S.probConsecuencias, ctx:S.probContexto, mag:S.probMagnitud },
    delim:{ pretest:S.pretest, test:S.test, postest:S.postest, mapsLink:S.mapsLink },
    linea:{ idx:S.lineaIdx, custom:S.lineaCustom, customTexto:S.lineaCustomTexto,
            adoptada:S.adoptada },
    efectoCentral:S.efectoCentral,
    consecuenciaSintoma:S.consecuenciaSintoma,
    categorias:S.categorias,
    causas:S.causas,
    nivelPareto:S.nivelPareto,
    paretoFreq:S.paretoFreq,
    priorizadas:S.priorizadas,
    especificos:S.especificos
  });
}

function restaurarEstado(json){
  var d;
  try { d=JSON.parse(json); } catch(e){ return false; }
  if(!d) return false;
  if(d.prob){ S.probPoblacion=d.prob.pob||''; S.probCausas=d.prob.cau||'';
    S.probConsecuencias=d.prob.con||''; S.probContexto=d.prob.ctx||''; S.probMagnitud=d.prob.mag||'';
    consolidarProblema(); }
  if(d.delim){ S.pretest=d.delim.pretest||''; S.test=d.delim.test||''; S.postest=d.delim.postest||''; if(d.delim.mapsLink) S.mapsLink=d.delim.mapsLink; }
  if(d.linea){ S.lineaIdx=(d.linea.idx==null?null:d.linea.idx); S.lineaCustom=!!d.linea.custom;
    S.lineaCustomTexto=d.linea.customTexto||''; S.adoptada=d.linea.adoptada||null; }
  if(d.categorias){ S.categorias=d.categorias; }
  if(typeof d.efectoCentral==='string'){ S.efectoCentral=d.efectoCentral; }
  if(typeof d.consecuenciaSintoma==='string'){ S.consecuenciaSintoma=d.consecuenciaSintoma; }
  if(d.causas){ S.causas=d.causas; }
  if(d.nivelPareto==='causa'||d.nivelPareto==='subcausa'){ S.nivelPareto=d.nivelPareto; }
  if(d.paretoFreq){ S.paretoFreq=d.paretoFreq; }
  if(d.priorizadas){ S.priorizadas=d.priorizadas; }
  if(d.especificos){ S.especificos=d.especificos; }
  return true;
}

// ============================================================
//  GUARDAR (POST al proxy)
// ============================================================
function guardar(){
  capturarPasoActual();
  // Validación mínima: el registro del grupo debe existir
  if(!S.ciclo || !S.numeroGrupo || !S.coordinador){
    toast('Completa primero los datos del grupo (Editar datos)',true);
    return;
  }
  var btnBar=document.getElementById('btnSaveBar');
  var btn8=document.getElementById('btnGuardar');
  var accion = S.recordId ? 'Actualizando…' : 'Guardando…';
  if(btnBar){ btnBar.disabled=true; btnBar.textContent=accion; }
  if(btn8){ btn8.disabled=true; btn8.textContent=accion; }

  var hoy=new Date();
  var fecha=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  var origen = (S.adoptada && S.adoptada.origen==='IA') ? ('IA-'+S.adoptada.tipo)
             : (S.adoptada && S.adoptada.origen==='paraguas') ? 'paraguas' : 'oficial';
  var grupoTxt = 'Grupo '+(S.numeroGrupo||'?')+' · '+(S.coordinador||'');

  var payload={
    problema_empresarial:S.problemaEmpresa,
    empresa:S.empresa,
    ubicacion:S.ubicacion,
    mapa:extraerCoords(S.mapsLink)||S.mapsLink,
    pretest:S.pretest, test:S.test, postest:S.postest,
    proposito:S.proposito,
    linea:lineaTexto()||'',
    origen_linea:origen,
    tema:S.tema,
    problema_general:S.problemaGeneral,
    problemas_especificos:serializarEspecificos(),
    estudiante_grupo:grupoTxt,
    curso:CURSO_FIJO,
    fecha_registro:fecha,
    ciclo:S.ciclo,
    numero_grupo:S.numeroGrupo,
    coordinador:S.coordinador,
    estructura:serializarEstado(),
    consecuencia:S.consecuenciaSintoma
  };

  function restore(){
    if(btnBar){ btnBar.disabled=false; btnBar.textContent = S.recordId?'Actualizar':'Guardar'; }
    if(btn8){ btn8.disabled=false; btn8.textContent='Guardar en QuintaDB'; }
  }

  var params = { payload: encodeURIComponent(JSON.stringify(payload)) };
  if(S.recordId) params.record_id = S.recordId;   // si existe, el proxy actualiza

  jsonpCall(params, function(res){
    if(res && res.ok){
      if(res.qid) S.recordId = res.qid;            // memoriza el id para próximas actualizaciones
      toast(S.recordId ? '✓ Planteamiento actualizado' : '✓ Planteamiento guardado');
      renderGrupoBar();
      restore();
    } else {
      restore();
      toast('Error al guardar: '+((res&&res.error)||'desconocido'),true);
    }
  }, function(){
    restore();
    toast('Error de red al guardar',true);
  });
}

// JSONP helper: inyecta un <script> con callback para saltar CORS
var _jsonpId=0;
function jsonpCall(params, onOk, onErr){
  _jsonpId++;
  var cbName='_pi_cb_'+_jsonpId;
  var timer=setTimeout(function(){ cleanup(); if(onErr)onErr(); }, 20000);
  window[cbName]=function(data){ cleanup(); if(onOk)onOk(data); };
  function cleanup(){ clearTimeout(timer); try{delete window[cbName];}catch(e){} if(sc&&sc.parentNode)sc.parentNode.removeChild(sc); }
  var qs='callback='+cbName;
  for(var k in params){ qs+='&'+k+'='+params[k]; }
  var sc=document.createElement('script');
  sc.src=PROXY_URL+'?'+qs;
  sc.onerror=function(){ cleanup(); if(onErr)onErr(); };
  document.body.appendChild(sc);
}
function pad(n){ return n<10?'0'+n:''+n; }

// ============================================================
//  LISTAR (GET al proxy)
// ============================================================
var _recordsCache={};
function cargarLista(){
  var cont=document.getElementById('listaCont');
  cont.innerHTML='<p class="note">Cargando…</p>';
  jsonpCall({ listar:'1' }, function(res){
    if(!res || !res.ok){ cont.innerHTML='<p class="hintWarn">No se pudo cargar la lista.</p>'; return; }
    var recs = (res.data && res.data.records) ? res.data.records : [];
    if(!recs.length){ cont.innerHTML='<p class="note">Aún no hay planteamientos guardados.</p>'; return; }
    var h='';
    _recordsCache={};
    // más recientes primero
    recs.slice().reverse().forEach(function(rec){
      _recordsCache[rec.id]=rec;
      var v=rec.values||{};
      function g(k){ return v[FIELD[k]]||''; }
      var ciclo=g('ciclo'), ngrupo=g('numero_grupo'), coord=g('coordinador');
      var grupoLinea = (ngrupo?('Grupo '+ngrupo):'') + (coord?(' · '+coord):'');
      if(!grupoLinea) grupoLinea = g('estudiante_grupo')||'—';
      h+='<div class="listItem">'+
         '<div class="listMeta">'+
         (ciclo?'<span class="badge">'+esc(ciclo)+'</span>':'')+
         '<span>'+esc(grupoLinea)+'</span>'+
         '<span>'+esc(g('empresa')||'')+'</span>'+
         '<span>'+esc(g('fecha_registro')||'')+'</span></div>'+
         '<div class="listTema">'+esc(g('tema')||g('problema_general')||'(sin tema)')+'</div>'+
         '<div class="listPg">'+esc(g('problema_general')||'')+'</div>'+
         '<button class="btnMini" style="margin-top:10px;" onclick="continuarEdicion(\''+rec.id+'\')">Continuar edición →</button>'+
         '</div>';
    });
    cont.innerHTML=h;
  }, function(){ cont.innerHTML='<p class="hintWarn">Error de red al cargar.</p>'; });
}

// Reconstruye el estado desde un registro guardado y abre el flujo para seguir editando
function continuarEdicion(recId){
  var rec=_recordsCache[recId];
  if(!rec){ toast('No se encontró el registro',true); return; }
  var v=rec.values||{};
  function g(k){ return v[FIELD[k]]||''; }

  // reset del estado conservando estructura
  S.recordId = recId;
  S.ciclo=g('ciclo'); S.numeroGrupo=g('numero_grupo'); S.coordinador=g('coordinador');
  S.empresa=g('empresa'); S.ubicacion=g('ubicacion'); S.mapsLink=g('mapa');
  S.pretest=g('pretest'); S.test=g('test'); S.postest=g('postest');
  S.proposito=g('proposito');
  S.tema=g('tema'); S.problemaGeneral=g('problema_general');

  // Preferir reconstrucción COMPLETA desde el JSON "Estructura completa"
  var estr=g('estructura');
  var reconstruido = estr ? restaurarEstado(estr) : false;

  // La consecuencia/síntoma ya tiene campo propio en QuintaDB: si el JSON de
  // "Estructura completa" no la trajo, se toma de ese campo.
  if(!S.consecuenciaSintoma) S.consecuenciaSintoma = g('consecuencia');

  if(!reconstruido){
    // Fallback: reconstruir lo básico desde los campos de texto sueltos
    var prob=g('problema_empresarial');
    S.probPoblacion=S.probCausas=S.probConsecuencias=S.probContexto=S.probMagnitud='';
    if(prob){
      var mapEtq={'Población afectada:':'probPoblacion','Posibles causas raíz:':'probCausas',
        'Consecuencias:':'probConsecuencias','Dónde/cómo/cuándo se manifiesta:':'probContexto',
        'Magnitud del problema:':'probMagnitud'};
      var encontrado=false;
      prob.split('\n').forEach(function(ln){
        for(var etq in mapEtq){ if(ln.indexOf(etq)===0){ S[mapEtq[etq]]=ln.slice(etq.length).trim(); encontrado=true; } }
      });
      if(!encontrado) S.probPoblacion=prob;
      consolidarProblema();
    }
    var lin=g('linea'), orig=g('origen_linea');
    if(lin){
      var idx=LINEAS.indexOf(lin);
      if(idx!==-1){ S.lineaIdx=idx; S.lineaCustom=false; S.adoptada={texto:lin,origen:'oficial'}; }
      else { S.lineaCustom=true; S.lineaCustomTexto=lin; S.adoptada={texto:lin,origen:orig||'paraguas'}; }
    }
  }

  toast(reconstruido ? 'Planteamiento cargado completo — continúa la edición' : 'Planteamiento cargado — continúa la edición');
  mostrarTab('flujo');
  go(1);
}

// ============================================================
//  TOAST
// ============================================================
var toastTimer;
function toast(msg,err){
  var t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.className='toast'+(err?' err':''); },3000);
}

render();
